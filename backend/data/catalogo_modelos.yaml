# Catálogo de modelos (§9.3). Editable sin tocar código.
#
# Los modelos de los proveedores reales quedan como PLANTILLAS vacías: no llevan
# nombres de modelos inventados y no se pueden elegir hasta que el usuario las
# rellene y quite `plantilla: true`.
#
# coste.unidad: imagen | segundo | caracter | operacion · moneda: solo USD
# coste.verificado: false en todo lo simulado → la interfaz dice «precio simulado».

- id: sim-imagen
  nombre_visible: "Simulado · imagen"
  acciones: [generar_imagen, imagen_con_referencias]
  proveedores: [simulado]
  admite: {primer_fotograma: false, ultimo_fotograma: false, referencias: 4, audio: false}
  duraciones_s: []
  relaciones: ["9:16", "16:9", "1:1", "4:5"]
  coste: {unidad: imagen, valor: 0.04, moneda: USD, verificado: false}
  formato: {png_lado_largo: 1280}

- id: sim-editar
  nombre_visible: "Simulado · editar imagen"
  acciones: [editar_imagen]
  proveedores: [simulado]
  admite: {primer_fotograma: false, ultimo_fotograma: false, referencias: 0, audio: false}
  duraciones_s: []
  relaciones: ["9:16", "16:9", "1:1", "4:5"]
  coste: {unidad: operacion, valor: 0.03, moneda: USD, verificado: false}
  formato: {png_lado_largo: 1280}

- id: sim-video
  nombre_visible: "Simulado · vídeo"
  acciones: [generar_video]
  proveedores: [simulado]
  admite: {primer_fotograma: true, ultimo_fotograma: true, referencias: 2, audio: false}
  duraciones_s: [3, 5, 10]
  relaciones: ["9:16", "16:9", "1:1", "4:5"]
  coste: {unidad: segundo, valor: 0.25, moneda: USD, verificado: false}
  formato: {fps: 24, lado_largo: 1280}

