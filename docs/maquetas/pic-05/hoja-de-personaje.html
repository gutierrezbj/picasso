<style>
/* Mesa a pantalla completa + lateral único a la derecha + barra inferior; paleta oscura aprobada en PIC-01 D11 */
:root{
  --fondo:#141414; --mesa:#191919; --panel:#222222; --campo:#2B2B2B; --borde:#3D3D3D;

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f);font-size:14px;line-height:1.45}

.pest.on{background:var(--campo);color:var(--tinta);font-weight:700;box-shadow:inset 0 -2px 0 var(--ambar)}
.gasto{margin-left:auto;font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.gasto b{color:var(--tinta)}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--borde);background:var(--campo)}

.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border-top:1px solid var(--borde);border-bottom:1px solid var(--borde);font-size:12px;color:var(--tinta2);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.proto .btn.armado{border-color:var(--error);color:var(--error)}
.cuerpo{flex:1;display:flex;flex-wrap:wrap;min-height:0}
main.mesa{flex:1 1 520px;min-width:0;background:var(--mesa);background-image:radial-gradient(#262626 1px,transparent 1px);background-size:22px 22px;padding:20px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.mesa h2{margin:0;font-size:16px;font-weight:800;text-wrap:balance}
.mesa .sub{color:var(--tinta2);font-size:13px;margin:0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.toma{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}

@media (max-width:900px){aside.lat{flex:1 1 100%;border-left:none;border-top:1px solid var(--borde)}}

.latc{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.contexto{font-size:12px;color:var(--tinta2)}

h3{margin:0;font-size:15px;font-weight:800}

.opcion{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--campo);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;width:100%}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col h4{margin:0 0 6px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--tinta2)}
.rasgo{display:flex;align-items:center;gap:6px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:5px 6px 5px 8px;font-size:12.5px;margin-bottom:5px}
.rasgo span{flex:1;min-width:0}
.rasgo button{height:22px;width:24px;border-radius:6px;border:1px solid var(--borde);background:var(--campo);font-size:12px;padding:0}
textarea{width:100%;min-height:96px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:8px;resize:vertical;line-height:1.45}
select{width:100%;height:30px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:0 6px}
.dirfila{display:grid;grid-template-columns:78px 1fr;gap:6px 8px;align-items:center;font-size:12.5px}
.porque{grid-column:2;color:var(--tinta2);font-size:11.5px;margin-top:-2px}
.director{font-size:11px;color:var(--ambar)}
.tarjeta{border:1px solid var(--borde);border-radius:10px;padding:10px 12px;background:var(--campo);display:flex;flex-direction:column;gap:6px}
.tarjeta pre{white-space:pre-wrap;margin:0;font-family:inherit;font-size:12px;color:var(--tinta);background:var(--fondo);border-radius:6px;padding:8px;max-height:150px;overflow:auto}
.imgs{font-size:12px;color:var(--tinta2);display:flex;flex-direction:column;gap:3px}
.fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.precio{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;padding:8px 2px;border-top:1px solid var(--borde)}
.aviso{font-size:12px;color:var(--tinta2);border-left:3px solid var(--ambar);padding:6px 10px;background:var(--fondo);border-radius:0 6px 6px 0}
.aviso.err{border-left-color:var(--error)}
.aviso.ok{border-left-color:var(--exito)}
.hist{margin:0;padding-left:16px;font-size:12px;color:var(--tinta2)}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border-top:1px solid var(--borde);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.alcance{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--campo);border:1px solid var(--borde)}
.barra .msg{flex:1;min-width:200px;color:var(--tinta2);font-size:12.5px}
.velo{position:fixed;inset:0;background:rgba(10,10,10,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--borde);border-radius:12px;width:min(860px,100%);max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.par .marco{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#9A9590}
.par svg{width:100%;height:100%;display:block}
.lista{margin:0;padding-left:18px;font-size:12.5px;color:var(--tinta2);columns:2;column-gap:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--campo);border:1px solid var(--ambar);border-radius:10px;padding:10px 14px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.cerrado{position:fixed;inset:0;background:var(--fondo);display:flex;align-items:center;justify-content:center;color:var(--tinta2);z-index:40}
@media (prefers-reduced-motion:no-preference){.toma.generando .marco{animation:latido 1.2s ease-in-out infinite}}
@keyframes latido{50%{opacity:.55}}
</style>

<script>
(function(){
const PRECIO = 0.15;
const MODELO = "Nano Banana Pro (fal)";
const TARIFA = "tarifa verificada el 14-11-2026";
const PRESUPUESTO = 5.00;
const MAX_REFS = 6;
const CLAVE = "picasso.pic05.maqueta";

const $ = s => document.querySelector(s);
const euro = n => n.toFixed(2).replace(".", ",") + " $";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const DIR_OPC = {
  encuadre:["Primer plano, cabeza y pelo enteros","Plano medio corto, cabeza y hombros","De pies a cabeza","Plano medio"],
  angulo:["Frontal, a la altura de los ojos","Tres cuartos, hacia su lado derecho","Perfil, lado derecho","Ligeramente picado"],
  objetivo:["85 mm","50 mm","35 mm"],
  luz:["Ventana lateral suave","Luz de estudio suave y pareja","Contraluz suave"],
  fondo:["Gris claro liso","Blanco liso","Gris medio liso"]
};
const PORQUE = {
  "85 mm":"No deforma la nariz y se leen bien los rasgos.",
  "50 mm":"Proporciones naturales del cuerpo entero.",
  "35 mm":"Más entorno; deforma algo la cara si te acercas.",
  "Ventana lateral suave":"Da volumen a la cara sin sombras duras.",
  "Luz de estudio suave y pareja":"Sin sombras; la cara se lee plana.",
  "Contraluz suave":"Separa del fondo; la cara queda más oscura.",
  "Gris claro liso":"El blanco quema los bordes del pelo; el gris no.",
  "Blanco liso":"Limpio, pero se pierden los bordes claros.",
  "Gris medio liso":"Bueno para pelo muy claro.",
  "Primer plano, cabeza y pelo enteros":"La cara grande y centrada: es el ancla.",
  "Plano medio corto, cabeza y hombros":"Nunca primer plano de lado: es donde más se inventa.",
  "De pies a cabeza":"Proporciones y vestuario base.",
  "Plano medio":"Pose y manos.",
  "Frontal, a la altura de los ojos":"Sin deformar ni dar intención.",
  "Tres cuartos, hacia su lado derecho":"Gira hacia la seña para fijarla.",
  "Perfil, lado derecho":"El mismo lado que la seña.",
  "Ligeramente picado":"Suaviza; no conviene en una referencia."
};
const VISTAS = {
  ancla:{nombre:"Retrato ancla", dir:["Primer plano, cabeza y pelo enteros","Frontal, a la altura de los ojos","85 mm","Ventana lateral suave","Gris claro liso"]},
  tres_cuartos:{nombre:"Tres cuartos", dir:["Plano medio corto, cabeza y hombros","Tres cuartos, hacia su lado derecho","85 mm","Ventana lateral suave","Gris claro liso"]},
  perfil:{nombre:"Perfil", dir:["Plano medio corto, cabeza y hombros","Perfil, lado derecho","85 mm","Ventana lateral suave","Gris claro liso"]},
  cuerpo_entero:{nombre:"Cuerpo entero", dir:["De pies a cabeza","Frontal, a la altura de los ojos","50 mm","Ventana lateral suave","Gris claro liso"]},
  expresion:{nombre:"Expresión", dir:["Plano medio corto, cabeza y hombros","Frontal, a la altura de los ojos","85 mm","Ventana lateral suave","Gris claro liso"]}
};
const EXPRESIONES = ["Neutra","Sonrisa amplia","Risa","Sorpresa","Seria","Pensativa"];
const USOS = [
  {id:"marca", t:"Retrato de marca", d:"Fotos de cara y medio cuerpo.", v:["tres_cuartos","cuerpo_entero"]},
  {id:"producto", t:"Fotos con producto", d:"Manos, vestuario y cuerpo entero.", v:["cuerpo_entero","tres_cuartos"]},
  {id:"escenas", t:"Escenas con movimiento", d:"Se gira, se ve de lado.", v:["tres_cuartos","perfil","cuerpo_entero"]},
  {id:"expresiones", t:"Emociones fuertes", d:"Primeros planos con gesto.", v:["tres_cuartos","expresion"]}
];
const PASOS = ["Receta","Origen","Identidad","Lo que falta","Uso y vistas","Dirección","Qué se envía"];

function rasgosMarta(){
  return [
    {id:"r1",t:"Mujer de unos 34 años, origen gallego",c:"fijo"},
    {id:"r2",t:"Cara ovalada, pómulos marcados, mentón estrecho",c:"fijo"},
    {id:"r3",t:"Pelo castaño oscuro, ondulado, por los hombros",c:"fijo"},
    {id:"r4",t:"Ojos verde oliva (NO marrones)",c:"fijo"},
    {id:"r5",t:"Complexión delgada, 1,68 m",c:"fijo"},
    {id:"r6",t:"Jersey de lana gris y chaqueta impermeable azul",c:"var"},
    {id:"r7",t:"Pelo recogido en coleta",c:"var"}
  ];
}
function preguntasMarta(){
  return [
    {id:"q1",q:"¿Tiene alguna seña en la piel? Dime de qué lado.",o:["Lunar pequeño junto a la ceja DERECHA","Pecas en la nariz","Ninguna"],r:null,campo:"fijo"},
    {id:"q2",q:"¿Lleva algo siempre?",o:["SIEMPRE lleva un colgante de plata fino","Gafas de pasta","Nada fijo"],r:null,campo:"fijo"},
    {id:"q3",q:"¿Vello facial o maquillaje que se note?",o:["Sin maquillaje visible","Maquillaje natural"],r:null,campo:"fijo"}
  ];
}
function preguntasNuevo(){
  return [
    {id:"n1",q:"¿Qué edad aparenta y de dónde es?",o:["Unos 30, mediterráneo","Unos 50, del norte de Europa","Unos 20, latinoamericano"],r:null,campo:"fijo"},
    {id:"n2",q:"¿Cómo es su cara, en tres o cuatro palabras?",o:["Cuadrada, mandíbula ancha, cejas pobladas","Alargada, nariz recta, labios finos","Redonda, mejillas llenas"],r:null,campo:"fijo"},
    {id:"n3",q:"¿Su pelo?",o:["Corto, negro y rizado","Rubio liso por los hombros","Canoso, rapado a los lados"],r:null,campo:"fijo"},
    {id:"n4",q:"¿Alguna seña, con su lado?",o:["Cicatriz pequeña en la ceja IZQUIERDA","Lunar en la mejilla DERECHA","Ninguna"],r:null,campo:"fijo"},
    {id:"n5",q:"¿Vestuario base?",o:["Camisa vaquera y pantalón chino","Sudadera gris lisa","Traje azul marino sin corbata"],r:null,campo:"var"}
  ];
}

function nuevoEstado(){
  return {
    tab:"director", paso:0, origen:null, nombre:"", real:false,
    rasgos:[], bloqueoManual:null, preguntas:[], uso:null, vistas:[], expr:["Sonrisa amplia"], vistaDir:null,
    preparado:false, revision:1, tomas:[], sel:null, armarDrift:false, gastoEst:0, gastoRes:0, ops:0,
    ficha:{vigente:2, borrador:null, refs:[]}, modal:null, accionBarra:null, nTomas:0
  };
}
let S = nuevoEstado();

function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }

function bloqueo(){
  if (S.bloqueoManual!==null) return S.bloqueoManual;
  const fijos = S.rasgos.filter(r=>r.c==="fijo").map(r=>r.t);
  if (!fijos.length) return "";
  const nombre = S.nombre || "El personaje";
  let t = nombre + ". " + fijos.join(". ") + ".";
  if (!S.rasgos.some(r=>/lunar|cicatriz|pecas|seña/i.test(r.t))) t += " Piel limpia, sin tatuajes.";
  t += " Piel real, con poros y pequeñas imperfecciones; sin retocar.";
  return t;
}
const palabras = t => (t.trim().match(/\S+/g)||[]).length;

function vistasPara(uso){
  const u = USOS.find(x=>x.id===uso);
  const tieneAncla = S.ficha.refs.some(r=>r.ancla) || S.origen==="refs";
  const lista = [];
  if (!tieneAncla) lista.push({clave:"ancla",marcada:true,fija:true});
  ["tres_cuartos","perfil","cuerpo_entero","expresion"].forEach(k=>{
    lista.push({clave:k, marcada: u ? u.v.includes(k) : false});
  });
  return lista.map(v=>({...v, dir:[...VISTAS[v.clave].dir], estado:"pendiente", hechaCon:null}));
}

function anclaLista(){ return S.origen==="refs" || S.ficha.refs.some(r=>r.ancla); }

function unidades(){
  const out=[];
  S.vistas.filter(v=>v.marcada).forEach(v=>{
    if (v.clave==="expresion") S.expr.forEach(e=>out.push({v, etiqueta:e}));
    else out.push({v, etiqueta:null});
  });
  return out;
}
function nombreUnidad(u){ return u.etiqueta ? "Expresión · "+u.etiqueta.toLowerCase() : VISTAS[u.v.clave].nombre; }

function refsDe(u){
  if (u.v.clave==="ancla") return [];
  const refs=[{n:1, que:"Ancla de "+(S.nombre||"el personaje"), para:"identidad: conserva exactamente su cara, pelo, tono de piel y complexión; no copies la pose, la ropa, el encuadre ni el fondo"}];
  if (u.v.clave==="expresion" && S.ficha.refs.some(r=>r.vista==="cuerpo_entero"))
    refs.push({n:2, que:"Cuerpo entero aprobado", para:"vestuario: conserva la ropa; no copies la pose ni la cara"});
  return refs;
}

function texto(u){
  const d = u.v.dir;
  const n = S.nombre || "El personaje";
  const desc = u.v.clave==="ancla" ? "Retrato fotográfico de una sola persona, expresión neutra, mirando a cámara."
    : u.v.clave==="expresion" ? "Foto de una sola persona con expresión: "+u.etiqueta.toLowerCase()+"."
    : VISTAS[u.v.clave].nombre+" de una sola persona.";
  const lineas = [desc, S.real ? n+" (persona real; la cara sale de la imagen 1, no del texto). Rasgo firma: "+(S.rasgos[0]?S.rasgos[0].t:"") : bloqueo(),
    "Encuadre: "+d[0]+". Ángulo: "+d[1]+". Objetivo: "+d[2]+". Luz: "+d[3]+". Fondo: "+d[4]+".",
    "Una sola persona en la imagen. Sin: piel de plástico, cara retocada, rasgos simétricos perfectos.",
    "Sin texto ni rótulos en la imagen."];
  refsDe(u).forEach(r=>lineas.push("Imagen "+r.n+": "+r.para+"."));
  if (S.real) lineas.push(n+" es una persona real: mantén su identidad facial exacta, con sus rasgos, edad y proporciones, tal como aparece en la imagen 1.");
  return lineas.join("\n");
}

function retrato(vista, variante, drift, expr){
  const piel = drift ? "#B98C70" : "#C9A184";
  const pelo = drift ? "#7A5A3A" : "#3B2A22";
  let cabeza, cuerpo, boca;
  const sonrisa = expr && /sonrisa|risa/i.test(expr);
  const sorpresa = expr && /sorpresa/i.test(expr);
  boca = sorpresa ? '<ellipse cx="0" cy="22" rx="5" ry="7" fill="#7a3d33"/>' : sonrisa ? '<path d="M-11 18 Q0 30 11 18" stroke="#7a3d33" stroke-width="3" fill="none"/>' : '<path d="M-9 21 L9 21" stroke="#7a3d33" stroke-width="3"/>';
  if (vista==="perfil"){
    cabeza = '<g transform="translate(150 150)"><path d="M-40 -60 Q20 -95 48 -40 Q60 0 40 50 L-30 55 Z" fill="'+pelo+'"/><path d="M-20 -55 Q45 -65 50 0 Q58 10 52 18 Q48 40 30 55 L-25 60 Q-35 0 -20 -55Z" fill="'+piel+'"/><circle cx="28" cy="-8" r="3.5" fill="#2c3b2a"/></g>';
  } else {
    const giro = vista==="tres_cuartos" ? 12 : 0;
    cabeza = '<g transform="translate('+(150+giro)+' '+(vista==="cuerpo_entero"?95:150)+') scale('+(vista==="cuerpo_entero"?0.45:1)+')"><ellipse cx="0" cy="-8" rx="62" ry="78" fill="'+pelo+'"/><ellipse cx="'+giro/2+'" cy="4" rx="46" ry="60" fill="'+piel+'"/><circle cx="'+(-16+giro)+'" cy="-6" r="4" fill="#2c3b2a"/><circle cx="'+(16+giro)+'" cy="-6" r="4" fill="#2c3b2a"/>'+(drift?'':'<circle cx="'+(26+giro)+'" cy="-22" r="2" fill="#5a3a2a"/>')+'<g transform="translate('+giro+' 0)">'+boca+'</g></g>';
  }
  if (vista==="cuerpo_entero") cuerpo = '<rect x="122" y="128" width="56" height="120" rx="18" fill="#7d8790"/><rect x="128" y="240" width="18" height="120" rx="8" fill="#3d4652"/><rect x="154" y="240" width="18" height="120" rx="8" fill="#3d4652"/>';
  else cuerpo = '<path d="M60 400 Q70 250 150 240 Q230 250 240 400Z" fill="#7d8790"/>';
  return '<svg viewBox="0 0 300 400" role="img" aria-label="Imagen simulada"><rect width="300" height="400" fill="#A7A39E"/>'+cuerpo+cabeza+'<text x="12" y="388" font-size="13" fill="#3a3a3a" font-family="Mulish,sans-serif">simulada · '+esc(variante)+'</text></svg>';
}

function gastoTxt(){ return 'Gasto: <b>'+euro(S.gastoEst)+'</b> estimado · <b>'+euro(S.gastoRes)+'</b> reservado'; }

function render(){
  const app = $("#app");

}

function cabecera(){

}
function proto(){
  return '<div class="proto"><b>Prototipo</b><span>Nada se genera ni se cobra. Simular:</span><button class="btn'+(S.armarDrift?' armado':'')+'" data-a="armarDrift">'+(S.armarDrift?'la próxima pierde la identidad ✓':'la próxima pierde la identidad')+'</button><button class="btn" data-a="cerrarVolver">cerrar y volver a abrir</button><button class="btn" data-a="cero" style="margin-left:auto">empezar de cero</button></div>';
}

function mesa(){
  let h = '<main class="mesa" aria-label="Mesa">';
  if (!S.nombre){
    h += '<h2>Mesa</h2><div class="vacio">La Mesa está vacía. Abre el <b>Director de Studio</b> en el lateral y elige «Hoja de personaje» para preparar las vistas de un personaje sin escribir prompts.</div>';
  } else {
    const pend = S.tomas.filter(t=>t.estado==="lista"&&!t.enFicha&&!t.desc).length;
    h += '<div><h2>Personaje · '+esc(S.nombre)+'</h2><p class="sub">'+S.tomas.length+' tomas · '+pend+' por revisar · ancla '+(anclaLista()?'aprobada':'pendiente')+'</p></div>';
    if (!S.tomas.length) h += '<div class="vacio">Todavía no hay tomas. Lo preparado en el Director aparece aquí al generar.</div>';
    h += '<div class="rejilla">';
    if (S.origen==="refs") h += '<div class="toma"><div class="marco">'+retrato("ancla","ancla v2",false)+'</div><div class="cab"><b>Ancla</b><span class="chip ficha">En la ficha · v2 · frontal</span></div></div>';
    S.tomas.forEach(t=>{
      h += '<button class="toma'+(S.sel===t.id?' sel':'')+(t.desc?' desc':'')+(t.estado==="generando"?' generando':'')+'" data-a="sel" data-id="'+t.id+'"><div class="marco">'+(t.estado==="generando"?'':retrato(t.vista,"T"+t.n,t.drift,t.etiqueta))+'</div><div class="cab"><b>T'+t.n+'</b><span>'+esc(t.nombre)+'</span>'+(t.fav?'<span class="estrella" aria-label="favorita">★</span>':'')+'</div>'+
        (t.estado==="generando"?'<span class="chip gen">Generando… '+euro(PRECIO)+' reservado</span>':t.enFicha?'<span class="chip ficha">En la ficha · v'+t.enFicha+' · '+esc(t.rol)+'</span>':t.desc?'<span class="chip err">'+(t.motivo==="identidad"?'No mantiene la identidad':'Descartada')+'</span>':'<span class="chip">Por revisar</span>')+'</button>';
    });
    h += '</div>';
  }
  return h + '</main>';
}

function lateral(){
  const t = S.tomas.find(x=>x.id===S.sel);
  let h = '<aside class="lat"><div class="tabs" role="tablist"><button class="tab'+(S.tab==="imagen"?' on':'')+'" role="tab" data-a="tab" data-v="imagen"'+(t?'':' disabled')+'>'+(t?'Imagen · T'+t.n:'Imagen')+'</button><button class="tab'+(S.tab==="director"?' on':'')+'" role="tab" data-a="tab" data-v="director">Director de Studio</button></div><div class="latc">';
  h += S.tab==="imagen" && t ? panelImagen(t) : panelDirector();
  return h + '</div></aside>';
}

function pasosNav(){
  return '<div class="pasos">'+PASOS.map((p,i)=>'<button class="paso'+(i===S.paso?' on':i<S.paso?' hecho':'')+'" data-a="ir" data-p="'+i+'"'+(i>maxPaso()?' disabled':'')+'>'+(i+1)+' · '+p+'</button>').join("")+'</div>';
}
function maxPaso(){
  if (!S.origen) return S.paso===0?1:0;
  if (!S.uso) return 4;
  return 6;
}

function panelDirector(){
  let h = '<div class="contexto">Trabajando sobre: <b>'+(S.nombre?'Personaje: '+esc(S.nombre)+' · ficha v'+S.ficha.vigente+(S.ficha.borrador?' + borrador v'+S.ficha.borrador:''):'Nueva receta')+'</b></div>';
  if (S.paso>0) h += pasosNav();
  const f = [pReceta,pOrigen,pIdentidad,pFalta,pUso,pDir,pEnvio][S.paso];
  return h + f();
}

function pReceta(){
  return '<h3>¿Qué quieres preparar?</h3><p class="ayuda">El Director prepara texto, referencias y dirección para que los revises. No genera ni gasta: eso lo hace el botón de la barra, con su precio.</p>'+
  '<button class="opcion" data-a="receta"><div><b>Hoja de personaje</b><small>Desde una referencia o una descripción hasta las vistas y expresiones que necesites.</small></div></button>'+
  '<button class="opcion" disabled><div><b>Fotografía de producto</b><small>Más adelante (18.66).</small></div></button>'+
  '<button class="opcion" disabled><div><b>Dirección visual del proyecto</b><small>Más adelante (18.66).</small></div></button>';
}
function pOrigen(){
  return '<h3>¿De dónde partimos?</h3>'+
  '<button class="opcion'+(S.origen==="refs"?' on':'')+'" data-a="origen" data-v="refs"><div><b>De referencias existentes</b><small>Marta · ficha v2 aprobada, con retrato frontal. El frontal será el ancla.</small></div></button>'+
  '<button class="opcion'+(S.origen==="desc"?' on':'')+'" data-a="origen" data-v="desc"><div><b>Describir un personaje nuevo</b><small>Sin foto. La primera vista será el retrato ancla, que apruebas antes de las demás.</small></div></button>'+
  '<label class="fila" style="font-size:12.5px;color:var(--tinta2)"><input type="checkbox" id="real" data-a="real"'+(S.real?' checked':'')+(S.origen==="refs"?'':' disabled')+'> Es una persona real: la cara sale de su foto y no se genera</label>';
}
function pIdentidad(){
  const fijos = S.rasgos.filter(r=>r.c==="fijo"), vars = S.rasgos.filter(r=>r.c==="var");
  const fila = (r,flecha)=>'<div class="rasgo"><span>'+esc(r.t)+'</span><button data-a="mover" data-id="'+r.id+'" aria-label="mover">'+flecha+'</button></div>';
  const b = bloqueo(), np = palabras(b);
  return '<h3>Identidad, apariencia y vestuario</h3><p class="ayuda">Lo de la izquierda viaja en cada imagen y no cambia. Lo de la derecha puede cambiar según la toma.</p>'+
  '<div class="cols"><div class="col"><h4>Se conserva</h4>'+(fijos.map(r=>fila(r,"→")).join("")||'<p class="ayuda">Nada todavía.</p>')+'</div><div class="col"><h4>Puede variar</h4>'+(vars.map(r=>fila(r,"←")).join("")||'<p class="ayuda">Nada todavía.</p>')+'</div></div>'+
  '<div class="bloque"><div class="fila"><b style="font-size:13px">Bloqueo de identidad</b><span class="director">'+(S.bloqueoManual!==null?'Editado por ti':'Preparado por el Director')+'</span><span class="precio" style="font-weight:600;font-size:12px;color:'+(np>=60&&np<=100?'var(--exito)':'var(--tinta2)')+'">'+np+' palabras</span></div><textarea id="bloqueo" data-a="bloqueo" aria-label="Bloqueo de identidad">'+esc(b)+'</textarea>'+(np<60?'<p class="ayuda">Con menos de 60 palabras la cara se sujeta peor. Responde lo que falta en el paso 4.</p>':'')+'</div>'+
  '<button class="btn amb" data-a="ir" data-p="3">Seguir</button>';
}
function pFalta(){
  const pend = S.preguntas.filter(q=>q.r===null).slice(0,2);
  let h = '<h3>Lo que falta</h3><p class="ayuda">Solo pregunto lo que la ficha no dice. Lo que omitas queda «sin decidir»; no me lo invento.</p>';
  if (!pend.length) h += '<div class="aviso ok">No falta nada para preparar las vistas.</div>';
  pend.forEach(q=>{
    h += '<div class="bloque"><b style="font-size:13px">'+esc(q.q)+'</b><div class="fila">'+q.o.map((o,i)=>'<button class="btn chico" data-a="resp" data-id="'+q.id+'" data-i="'+i+'">'+esc(o)+'</button>').join("")+'<button class="btn txt chico" data-a="resp" data-id="'+q.id+'" data-i="-1">Omitir</button></div></div>';
  });
  const omit = S.preguntas.filter(q=>q.r==="omit");
  if (omit.length) h += '<p class="ayuda">Sin decidir: '+omit.map(q=>esc(q.q)).join(" · ")+'</p>';
  return h + '<button class="btn amb" data-a="ir" data-p="4">Seguir</button>';
}
function pUso(){
  let h = '<h3>¿Para qué lo vas a usar?</h3><p class="ayuda">Según el uso propongo vistas. Marca solo las que necesites; no hace falta generarlas todas.</p>';
  h += USOS.map(u=>'<button class="opcion'+(S.uso===u.id?' on':'')+'" data-a="uso" data-v="'+u.id+'"><div><b>'+u.t+'</b><small>'+u.d+'</small></div></button>').join("");
  if (S.uso){
    h += '<div class="bloque"><b style="font-size:13px">Vistas</b>';
    S.vistas.forEach((v,i)=>{
      const bloqueada = v.clave!=="ancla" && !anclaLista();
      h += '<label class="fila" style="font-size:13px"><input type="checkbox" data-a="marcar" data-i="'+i+'"'+(v.marcada?' checked':'')+(v.fija||bloqueada?' disabled':'')+'> '+VISTAS[v.clave].nombre+(v.fija?' <span class="chip">obligatoria: aún no hay ancla</span>':'')+(bloqueada?' <span class="chip">cuando apruebes el ancla</span>':'')+(v.estado==="aprobada"?' <span class="chip ficha">aprobada</span>':'')+'</label>';
    });
    const ex = S.vistas.find(v=>v.clave==="expresion");
    if (ex && ex.marcada && anclaLista()){
      h += '<div class="fila" style="font-size:12px;color:var(--tinta2)">Expresiones (de 1 a 3):</div><div class="fila">'+EXPRESIONES.map(e=>'<button class="btn chico" style="'+(S.expr.includes(e)?'border-color:var(--ambar);color:var(--ambar)':'')+'" data-a="expr" data-v="'+e+'">'+e+'</button>').join("")+'</div>';
    }
    h += '</div><button class="btn amb" data-a="ir" data-p="5">Seguir</button>';
  }
  return h;
}
function pDir(){
  const marcadas = S.vistas.filter(v=>v.marcada && (v.clave==="ancla"||anclaLista()));
  if (!marcadas.length) return '<p class="ayuda">Marca alguna vista en el paso 5.</p>';
  if (!S.vistaDir || !marcadas.some(v=>v.clave===S.vistaDir)) S.vistaDir = marcadas[0].clave;
  const v = S.vistas.find(x=>x.clave===S.vistaDir);
  const nombres = ["Encuadre","Ángulo","Objetivo","Luz","Fondo"], claves = ["encuadre","angulo","objetivo","luz","fondo"];
  let h = '<h3>Dirección de cada vista</h3><p class="ayuda">Para una referencia manda que se lean bien los rasgos. Lo que cambies aquí vale para esta vista y no toca la ficha.</p><div class="fila">'+marcadas.map(m=>'<button class="btn chico" style="'+(m.clave===S.vistaDir?'border-color:var(--ambar);color:var(--ambar)':'')+'" data-a="vdir" data-v="'+m.clave+'">'+VISTAS[m.clave].nombre+'</button>').join("")+'</div><div class="bloque"><span class="director">Preparado por el Director · editable</span><div class="dirfila">';
  claves.forEach((k,i)=>{
    h += '<label for="d'+k+'">'+nombres[i]+'</label><select id="d'+k+'" data-a="dir" data-k="'+i+'">'+DIR_OPC[k].map(o=>'<option'+(o===v.dir[i]?' selected':'')+'>'+esc(o)+'</option>').join("")+'</select>';
    if (PORQUE[v.dir[i]]) h += '<span class="porque">'+esc(PORQUE[v.dir[i]])+'</span>';
  });
  h += '</div><div class="fila"><span class="ayuda">¿Más íntimo? Plano más cerrado, 85 mm y luz lateral suave.</span><button class="btn txt chico" data-a="intimo">Aplicar «más íntimo»</button><button class="btn txt chico" data-a="restablecer">Restablecer</button></div></div>';
  return h + '<button class="btn amb" data-a="ir" data-p="6">Ver qué se enviará</button>';
}
function pEnvio(){
  const us = unidades().filter(u=>u.v.clave==="ancla"||anclaLista()).filter(u=>u.v.estado!=="aprobada");
  let h = '<h3>Qué se enviará</h3><p class="ayuda">Una generación por tarjeta. Imágenes numeradas en el orden en que viajan, con su para qué.</p>';
  if (!us.length) return h + '<div class="aviso ok">No queda ninguna vista por generar.</div>';
  us.forEach(u=>{
    const rs = refsDe(u);
    h += '<div class="tarjeta"><div class="fila"><b>'+esc(nombreUnidad(u))+'</b><span class="precio">'+euro(PRECIO)+'</span></div><pre>'+esc(texto(u))+'</pre><div class="imgs">'+(rs.length?rs.map(r=>'<span>Imagen '+r.n+' · '+esc(r.que)+' → '+esc(r.para.split(":")[0])+'</span>').join(""):'<span>Sin imágenes: se genera desde la descripción.</span>')+'<span>Modelo: '+MODELO+' · '+TARIFA+' · '+rs.length+' de '+MAX_REFS+' referencias</span></div></div>';
  });
  const total = us.length*PRECIO, queda = PRESUPUESTO - S.gastoEst - S.gastoRes;
  h += '<div class="total"><span>Total previsto · '+us.length+' generaciones</span><b>'+euro(total)+'</b></div>';
  h += '<div class="aviso'+(total>queda?' err':'')+'">Presupuesto de ejemplo: '+euro(PRESUPUESTO)+'. Te quedan '+euro(queda)+'.'+(total>queda?' Este lote lo supera: te pediré confirmación.':'')+'</div>';
  h += '<button class="btn amb" data-a="preparar">'+(S.preparado?'Preparado · volver a preparar':'Preparar')+'</button><p class="ayuda">Preparar guarda y deja listo el botón de la barra. No genera ni gasta.</p>';
  return h;
}

function panelImagen(t){
  let h = '<div class="marco" style="aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#9A9590;max-width:100%">'+(t.estado==="generando"?'':retrato(t.vista,"T"+t.n,t.drift,t.etiqueta))+'</div>';
  h += '<div class="fila"><b>T'+t.n+' · '+esc(t.nombre)+'</b>'+(t.enFicha?'<span class="chip ficha">En la ficha · v'+t.enFicha+' · '+esc(t.rol)+'</span>':'')+'</div>';

  h += '<div class="fila"><button class="btn chico" data-a="fav">'+(t.fav?'★ Favorita':'☆ Favorita')+'</button><button class="btn chico" data-a="comparar">Comparar con el ancla</button>'+(t.desc?'<button class="btn chico" data-a="recuperar">Recuperar</button>':'<button class="btn chico" data-a="descartar">Descartar</button>')+'</div>';
  h += '<p class="ayuda">★ es solo «me gusta». Lo que viaja con el personaje es lo aprobado para la ficha.</p>';

  if (t.motivo==="identidad"){
    const dos = S.tomas.filter(x=>x.vista===t.vista&&x.motivo==="identidad").length>=2;
    h += '<div class="bloque"><b style="font-size:13px">¿Qué hacemos con esta vista?</b><span class="director">Preparado por el Director · nada se ejecuta solo</span>'+
      '<button class="opcion" data-a="corregir"><div><b>1 · Corregir editando · '+euro(PRECIO)+'</b><small>Sobre T'+t.n+' con el ancla: «cambia solo la cara para que sea la de la imagen 1».</small></div></button>'+
      '<button class="opcion" data-a="revdir"><div><b>2 · Revisar la dirección</b><small>Por ejemplo, de perfil a tres cuartos. Sin coste.</small></div></button>'+
      '<button class="opcion" data-a="regenerar"><div><b>3 · Volver a generar · '+euro(PRECIO)+'</b><small>La misma vista, desde la barra.</small></div></button>'+

  h += '<div><b style="font-size:13px">Historial</b><ul class="hist">'+t.hist.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>';
  return h;
}

function barra(){
  let alc = 'Nueva imagen', msg = 'Escribe en la barra o prepara con el Director.', btn = '<button class="btn amb" disabled>Generar</button>';

  }
  if (S.modal.tipo==="ficha"){
    const refs = S.ficha.refs;
    let h = '<div class="velo" data-a="cerrarModal"><div class="modal" role="dialog" aria-label="Ficha del personaje" data-stop="1"><div class="fila"><h3>Ficha de '+esc(S.nombre)+'</h3><button class="btn chico" style="margin-left:auto" data-a="cerrarModal">Cerrar</button></div>';
    h += '<p class="ayuda">Vigente: v'+S.ficha.vigente+' (aprobada, no se toca). '+(S.ficha.borrador?'Borrador: v'+S.ficha.borrador+'. Lo aprobado en la Mesa entra aquí.':'Sin borrador.')+'</p>';
    h += '<div class="bloque"><b style="font-size:13px">Referencias</b>'+(S.origen==="refs"?'<span style="font-size:12.5px">v2 · frontal · ancla</span>':'')+(refs.map(r=>'<span style="font-size:12.5px">v'+r.v+' · '+esc(r.rol)+(r.ancla?' · ancla':'')+' · de T'+r.n+(r.v===S.ficha.borrador?' (borrador)':'')+'</span>').join("")||(S.origen==="refs"?'':'<span class="ayuda">Ninguna todavía.</span>'))+'</div>';
    h += '<div class="bloque"><b style="font-size:13px">Bloqueo de identidad</b><span style="font-size:12.5px">'+esc(bloqueo()||"Sin decidir.")+'</span></div>';
    if (S.ficha.borrador) h += '<button class="btn amb" data-a="aprobarFicha"'+(refs.some(r=>r.v===S.ficha.borrador)?'':' disabled')+'>Aprobar ficha v'+S.ficha.borrador+'</button><p class="ayuda">Aprobada, la versión queda inmutable. Para cambiarla después se crea otra.</p>';
    return h + '</div></div>';
  }
  return "";
}

function toast(t){
  const d = document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d);
  setTimeout(()=>d.remove(), 3200);
}

function asegurarBorrador(){
  if (!S.ficha.borrador) S.ficha.borrador = S.ficha.vigente + 1;
}

function generarUnidades(us, extra){
  const total = us.length*PRECIO;
  if (S.gastoEst + S.gastoRes + total > PRESUPUESTO){ toast("Supera el presupuesto de ejemplo: en Picasso pediría confirmación."); }
  S.revision++;
  us.forEach(u=>{
    S.nTomas++;
    const id = "t"+S.nTomas;
    const rol = u.v.clave==="ancla"?"frontal":u.v.clave==="expresion"?"expresión · "+u.etiqueta.toLowerCase():VISTAS[u.v.clave].nombre.toLowerCase();
    const idp = "sesion:pic05:"+u.v.clave+(u.etiqueta?"-"+u.etiqueta.toLowerCase().replace(/\s/g,"_"):"")+":"+S.revision;
    const t = {id, n:S.nTomas, vista:u.v.clave, etiqueta:u.etiqueta, nombre:nombreUnidad(u), rol, estado:"generando", fav:false, desc:false, motivo:null, enFicha:null, drift:false, texto:extra&&extra.texto?extra.texto:texto(u), idp, hist:["Generada con la ficha v"+S.ficha.vigente+" · "+euro(PRECIO)+" estimado · "+idp+(extra&&extra.nota?" · "+extra.nota:"")]};
    if (S.armarDrift){ t.drift = true; S.armarDrift = false; }
    S.tomas.push(t);
    u.v.estado = "generando";
    S.gastoRes += PRECIO; S.ops++;
  });
  setTimeout(terminar, 1100);
}
function terminar(){
  let cambio=false;
  S.tomas.forEach(t=>{ if (t.estado==="generando"){ t.estado="lista"; S.gastoRes-=PRECIO; S.gastoEst+=PRECIO; cambio=true;
    const v = S.vistas.find(x=>x.clave===t.vista); if (v && v.estado==="generando") v.estado="por_revisar"; } });
  S.gastoRes = Math.max(0, Math.round(S.gastoRes*100)/100);
  if (cambio) render();
}

const acciones = {
  receta(){ S.paso=1; },
  origen(el){
    S.origen = el.dataset.v; S.uso=null; S.vistas=[]; S.preparado=false; S.bloqueoManual=null;
    if (S.origen==="refs"){ S.nombre="Marta"; S.rasgos=rasgosMarta(); S.preguntas=preguntasMarta(); S.ficha={vigente:2,borrador:null,refs:[]}; }
    else { S.nombre="Personaje nuevo"; S.real=false; S.rasgos=[]; S.preguntas=preguntasNuevo(); S.ficha={vigente:1,borrador:null,refs:[]}; }
    S.paso=2;
  },
  real(el){ S.real = el.checked; },
  mover(el){ const r=S.rasgos.find(x=>x.id===el.dataset.id); r.c = r.c==="fijo"?"var":"fijo"; S.bloqueoManual=null; marcarCambio(); },
  resp(el){
    const q=S.preguntas.find(x=>x.id===el.dataset.id), i=+el.dataset.i;
    if (i<0){ q.r="omit"; }
    else { q.r=q.o[i]; if (!/^Ninguna|^Nada fijo/.test(q.r)) S.rasgos.push({id:"a"+q.id,t:q.r,c:q.campo}); S.bloqueoManual=null; marcarCambio(); }
  },
  uso(el){ S.uso=el.dataset.v; S.vistas=vistasPara(S.uso); S.preparado=false; },
  marcar(el){ S.vistas[+el.dataset.i].marcada = el.checked; S.preparado=false; },
  expr(el){ const e=el.dataset.v; if (S.expr.includes(e)) { if (S.expr.length>1) S.expr=S.expr.filter(x=>x!==e); } else if (S.expr.length<3) S.expr.push(e); else toast("Como mucho 3 expresiones por ronda."); S.preparado=false; },
  vdir(el){ S.vistaDir=el.dataset.v; },
  dir(el){ const v=S.vistas.find(x=>x.clave===S.vistaDir); v.dir[+el.dataset.k]=el.value; if (v.estado==="preparada") v.estado="pendiente"; S.preparado=false; },
  intimo(){ const v=S.vistas.find(x=>x.clave===S.vistaDir); v.dir[0]="Plano medio corto, cabeza y hombros"; v.dir[2]="85 mm"; v.dir[3]="Ventana lateral suave"; S.preparado=false; toast("«Más íntimo»: plano más cerrado, 85 mm y luz lateral suave. Revísalo."); },
  restablecer(){ const v=S.vistas.find(x=>x.clave===S.vistaDir); v.dir=[...VISTAS[v.clave].dir]; S.preparado=false; },
  ir(el){ S.paso=+el.dataset.p; },
  preparar(){
    unidades().forEach(u=>{ if ((u.v.clave==="ancla"||anclaLista()) && u.v.estado!=="aprobada" && u.v.estado!=="generando") u.v.estado="preparada"; });
    S.preparado=true; toast("Preparado y guardado. No se ha generado nada ni se ha gastado.");
  },
  generar(){
    const us = unidades().filter(u=>u.v.clave==="ancla"||anclaLista()).filter(u=>u.v.estado==="preparada");
    const vistos = new Set(); const lote = us.filter(u=>{ const k=u.v.clave+(u.etiqueta||""); if (vistos.has(k)) return false; vistos.add(k); return true; });
    generarUnidades(lote); S.preparado=false;
  },
  sel(el){ S.sel=el.dataset.id; S.tab="imagen"; },
  tab(el){ S.tab=el.dataset.v; },
  fav(){ const t=cur(); t.fav=!t.fav; t.hist.push(t.fav?"★ favorita":"★ quitada"); },
  descartar(){ const t=cur(); t.desc=true; t.hist.push("Descartada"); },
  recuperar(){ const t=cur(); t.desc=false; t.motivo=null; t.hist.push("Recuperada"); },
  comparar(){ S.modal={tipo:"comparar", id:S.sel}; },
  aprobar(){
    const t=cur(); asegurarBorrador();
    const ancla = t.vista==="ancla";
    t.enFicha=S.ficha.borrador; t.hist.push("Aprobada para la ficha v"+S.ficha.borrador+" · "+t.rol+(ancla?" · ancla":"")+" (no marca ★)");
    S.ficha.refs.push({v:S.ficha.borrador, rol:t.rol, ancla, n:t.n});
    const v=S.vistas.find(x=>x.clave===t.vista); if (v && v.clave!=="expresion") v.estado="aprobada";
    S.modal=null;
    if (ancla){ S.vistas.forEach(x=>{ if (x.clave!=="ancla" && S.uso){ const u=USOS.find(z=>z.id===S.uso); x.marcada=u.v.includes(x.clave); } }); toast("Ancla aprobada en el borrador. Ya puedes preparar las demás vistas."); }
    else toast("Añadida al borrador v"+S.ficha.borrador+". La ficha vigente no cambia hasta que apruebes la versión.");
  },
  noid(){ const t=cur(); t.desc=true; t.motivo="identidad"; t.hist.push("Descartada: no mantiene la identidad. El medio se conserva."); S.modal=null; S.tab="imagen"; },
  corregir(){ const t=cur(); S.accionBarra={alcance:"Editar T"+t.n, msg:"Preparado por el Director: corregir T"+t.n+" con el ancla como imagen 2, «cambia solo la cara». El modelo puede alterar otros detalles.", boton:"Aplicar cambio · "+euro(PRECIO), tipo:"corregir", id:t.id}; },
  revdir(){ const t=cur(); S.tab="director"; S.paso=5; S.vistaDir=t.vista; },
  regenerar(){ const t=cur(); S.accionBarra={alcance:"Hoja de personaje · "+t.nombre, msg:"Preparado: volver a generar «"+t.nombre+"» con la misma dirección.", boton:"Generar 1 vista · "+euro(PRECIO), tipo:"regenerar", id:t.id}; },
  cancelarBarra(){ S.accionBarra=null; },
  ejecutarBarra(){
    const a=S.accionBarra, t=S.tomas.find(x=>x.id===a.id), v=S.vistas.find(x=>x.clave===t.vista)||{clave:t.vista,dir:[...VISTAS[t.vista].dir]};
    const u={v, etiqueta:t.etiqueta};
    if (a.tipo==="corregir") generarUnidades([u],{nota:"edición de T"+t.n+" con el ancla", texto:"Cambia solo la cara para que sea la de la imagen 2. Mantén todo lo demás como está.\nImagen 1: T"+t.n+" (imagen a editar).\nImagen 2: identidad de "+S.nombre+": conserva exactamente su cara, pelo, tono de piel y complexión."});
    else generarUnidades([u]);
    S.accionBarra=null;
  },
  cerrarModal(){ S.modal=null; },
  verFicha(){ S.modal={tipo:"ficha"}; },
  aprobarFicha(){ S.ficha.vigente=S.ficha.borrador; S.ficha.borrador=null; S.modal=null; toast("Ficha v"+S.ficha.vigente+" aprobada y vigente. Ya no se puede cambiar: los cambios irán a una versión nueva."); },
  armarDrift(){ S.armarDrift=!S.armarDrift; },
  cero(){ S=nuevoEstado(); try{ localStorage.removeItem(CLAVE); }catch(e){} },
  cerrarVolver(){
    const copia = JSON.stringify(S);
    const v = document.createElement("div"); v.className="cerrado"; v.textContent="Taller cerrado. Volviendo a abrir…"; document.body.appendChild(v);
    setTimeout(()=>{
      S = JSON.parse(copia); S.modal=null;
      const enCurso = S.tomas.filter(t=>t.estado==="generando").length;
      v.remove(); render();
      const pend = unidades().filter(u=>u.v.estado==="preparada").length, rev = S.tomas.filter(t=>t.estado==="lista"&&!t.enFicha&&!t.desc).length;
      toast("Recuperado: paso «"+PASOS[S.paso]+"», "+pend+" vistas preparadas, "+rev+" por revisar"+(enCurso?", "+enCurso+" en curso (se reconcilian por id_peticion, sin duplicar)":"")+".");
      if (enCurso) setTimeout(terminar, 900);
    }, 700);
    return "noRender";
  }
};
function cur(){ return S.tomas.find(x=>x.id===S.sel); }
function marcarCambio(){
  S.vistas.forEach(v=>{ if (v.estado==="preparada") v.estado="pendiente"; });
  if (S.preparado){ S.preparado=false; toast("Has cambiado un rasgo: las vistas preparadas se rehacen. Las aprobadas quedan marcadas como hechas antes del cambio."); }
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]");
  if (!el) return;
  if (el.classList.contains("velo") && e.target.closest("[data-stop]")) return;
  const a = el.dataset.a;
  if (["marcar","real","dir","bloqueo"].includes(a)) return;
  if (el.disabled) return;
  const r = acciones[a] && acciones[a](el);
  if (r!=="noRender") render();
});
document.addEventListener("change", e=>{
  const el = e.target; const a = el.dataset && el.dataset.a;
  if (a==="marcar"||a==="real"||a==="dir"){ acciones[a](el); render(); }
});
document.addEventListener("input", e=>{
  if (e.target.id==="bloqueo"){ S.bloqueoManual=e.target.value; guardar(); }
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && S.modal){ S.modal=null; render(); } });

try{ const g = localStorage.getItem(CLAVE); if (g){ const x = JSON.parse(g); if (x && x.tomas){ S = x; S.modal=null; S.tomas.forEach(t=>{ if (t.estado==="generando") setTimeout(terminar, 900); }); } } }catch(e){}
render();
})();
</script>
