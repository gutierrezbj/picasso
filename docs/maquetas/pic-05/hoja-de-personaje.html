<title>Picasso · Hoja de personaje</title>

<style>
/* Mesa + panel del Director (al lado ≥1024, superpuesto 700–1023, pantalla completa <700) + barra con la siguiente acción; paleta oscura PIC-01 D11 */
:root{
  --fondo:#141414; --mesa:#191919; --panel:#222222; --campo:#2B2B2B; --borde:#3D3D3D;
  --tinta:#F5F0E8; --tinta2:#B8B2A9; --ambar:#F5A623; --ambar2:#FFB740; --sobre-ambar:#191919;
  --error:#E57373; --exito:#81B88B;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f);font-size:14px;line-height:1.45}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top b.marca{font-size:15px}
.ruta{color:var(--tinta2);font-size:13px}
.pest{padding:5px 10px;border-radius:8px;font-size:13px;color:var(--tinta2)}
.pest.on{background:var(--campo);color:var(--tinta);font-weight:700;box-shadow:inset 0 -2px 0 var(--ambar)}
.der{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sim{font-size:11px;padding:3px 8px;border-radius:99px;border:1px dashed var(--tinta2);color:var(--tinta2)}
.btn{min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--borde);background:var(--campo)}
.btn:hover{border-color:var(--tinta2)}
.btn.amb{background:var(--ambar);border-color:var(--ambar);color:var(--sobre-ambar);font-weight:700}
.btn.amb:hover{background:var(--ambar2)}
.btn.chico{min-height:26px;padding:0 9px;font-size:12px}
.btn.txt{background:none;border-color:transparent;color:var(--ambar);padding:0 4px}
.btn.pastilla{border-radius:99px;font-size:12px;min-height:26px;font-variant-numeric:tabular-nums}

.btn.armado{border-color:var(--error);color:var(--error)}
.cuerpo{flex:1;min-height:0;display:flex;position:relative}
main.mesa{flex:1;min-width:0;overflow:auto;background:var(--mesa);background-image:radial-gradient(#262626 1px,transparent 1px);background-size:22px 22px;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.mesa h2{margin:0;font-size:16px;font-weight:800}
.sub{color:var(--tinta2);font-size:13px;margin:0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.toma{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.toma.ancha{grid-column:span 2}
.toma.sel{border-color:var(--ambar);box-shadow:0 0 0 1px var(--ambar)}
.toma.apagada{opacity:.5}
.marco{border-radius:6px;background:#9A9590;overflow:hidden}

.toma .marco{aspect-ratio:3/4}

.cab{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.cab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.estrella{margin-left:auto;color:var(--ambar)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;font-size:11px;background:var(--campo);color:var(--tinta2);border:1px solid var(--borde);width:max-content;max-width:100%}
.chip.ok{color:var(--exito);border-color:#4f6e55}
.chip.err{color:var(--error);border-color:#7a4545}
.chip.amb{color:var(--ambar);border-color:#7a5a20}
.vacio{border:1px dashed var(--borde);border-radius:10px;padding:24px 18px;color:var(--tinta2);max-width:560px}
.alerta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid #7a5a20;background:#2a2214;border-radius:10px;padding:10px 12px;font-size:13px}
aside.lat{width:390px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--borde);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--borde)}
.tab{min-height:30px;padding:0 10px;border-radius:8px;border:none;background:none;color:var(--tinta2)}
.tab.on{background:var(--campo);color:var(--tinta);font-weight:700;box-shadow:inset 0 -2px 0 var(--ambar)}
.cerrar-panel{display:none !important;margin-left:auto}
.latc{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;flex:1}
@media (max-width:1023px){
  aside.lat{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:15;box-shadow:-12px 0 30px rgba(0,0,0,.5)}
  aside.lat.cerrado{display:none}

}
@media (max-width:699px){
  aside.lat{width:100%;border-left:none}

}
.contexto{font-size:12px;color:var(--tinta2)}
.contexto b{color:var(--tinta)}
.pasos{display:flex;flex-wrap:wrap;gap:4px}
.paso{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--borde);background:none;color:var(--tinta2)}
.paso.on{border-color:var(--ambar);color:var(--ambar)}
.paso.hecho{color:var(--tinta)}
h3{margin:0;font-size:15px;font-weight:800}
.ayuda{margin:0;color:var(--tinta2);font-size:12.5px}
.bloque{background:var(--campo);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.listo{border-color:var(--ambar)}
.opcion{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--campo);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;width:100%}
.opcion:hover{border-color:var(--tinta2)}
.opcion.on{border-color:var(--ambar)}
.opcion small{display:block;color:var(--tinta2);font-size:12px}
.campo{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--borde);padding-bottom:8px}
.campo:last-child{border-bottom:none}
.campo .cab{justify-content:space-between}
.campo label.t{font-size:12.5px;font-weight:700}
input[type=text]{width:100%;min-height:30px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:4px 8px}
.ejemplos{display:flex;flex-wrap:wrap;gap:4px}
.ej{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--borde);background:none;color:var(--tinta2)}
.ej:hover{color:var(--tinta);border-color:var(--tinta2)}
.cons{font-size:11.5px;color:var(--tinta2);display:flex;gap:4px;align-items:center}
select{width:100%;min-height:30px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:0 6px}
.dirfila{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;align-items:center;font-size:12.5px}
.porque{grid-column:2;color:var(--tinta2);font-size:11.5px;margin-top:-2px}
.resumen{font-size:12.5px;line-height:1.5}
.tarjeta{border:1px solid var(--borde);border-radius:10px;padding:10px 12px;background:var(--campo);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.tarjeta .t{display:flex;gap:8px;align-items:baseline}
.precio{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--tinta2);font-size:12px}
details{font-size:12px;color:var(--tinta2)}
summary{cursor:pointer;color:var(--tinta2)}
details pre{white-space:pre-wrap;font-family:inherit;font-size:12px;color:var(--tinta);background:var(--fondo);border-radius:6px;padding:8px;margin:6px 0 0;max-height:180px;overflow:auto}
.fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.insp-img{height:min(45vh,420px);max-width:100%;aspect-ratio:3/4;margin:0 auto;border-radius:8px;overflow:hidden;background:#9A9590;flex-shrink:0}
.insp-img.ancha{aspect-ratio:16/9;height:auto;width:100%}
.insp-img svg{width:100%;height:100%;display:block}
.hist{margin:6px 0 0;padding-left:16px}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border-top:1px solid var(--borde);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:16}
.barra .msg{flex:1;min-width:180px;font-size:13px}
.barra .msg small{display:block;color:var(--tinta2);font-size:12px}
.pie{background:var(--panel);border-top:1px solid var(--borde);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px));font-size:12px}
.pie .fila{margin-top:6px}
.velo{position:fixed;inset:0;background:rgba(10,10,10,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--panel);border:1px solid var(--borde);border-radius:12px;width:min(820px,100%);max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.par .marco{aspect-ratio:3/4;max-height:52vh;margin:0 auto;width:100%}
.lista{margin:0;padding-left:18px;font-size:12.5px;color:var(--tinta2);columns:2;column-gap:24px}
table.costes{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.costes td,table.costes th{padding:5px 6px;border-bottom:1px solid var(--borde);text-align:left}
table.costes td:last-child,table.costes th:last-child{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:var(--campo);border:1px solid var(--ambar);border-radius:10px;padding:10px 14px;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.cerrado-velo{position:fixed;inset:0;background:var(--fondo);display:flex;align-items:center;justify-content:center;color:var(--tinta2);z-index:50}
@media (prefers-reduced-motion:no-preference){.generando .marco{animation:latido 1.2s ease-in-out infinite}}
@keyframes latido{50%{opacity:.55}}
</style>

<script>
(function(){
const MODELO = "Nano Banana Pro (fal)";
const TARIFA_FECHA = "14-11-2026";
const CLAVE = "picasso.pic05.maqueta.r3";
const $ = s => document.querySelector(s);
const euro = n => n.toFixed(2).replace(".", ",") + " $";
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const red = n => Math.max(0, Math.round(n*100)/100);

const OPC = {
  fondo:["Gris claro liso","Gris medio liso","Blanco liso"],
  luz:["Ventana lateral suave","Luz de estudio suave y pareja","Contraluz suave"],
  acabado:["Foto natural, colores sin editar, grano fino","Estudio limpio, colores neutros","Ilustración"],
  enc:["Primer plano, cabeza y pelo enteros","Plano medio corto, cabeza y hombros","De pies a cabeza","Plano medio"],
  ang:["Frontal, a la altura de los ojos","Tres cuartos, hacia el lado de su seña","Perfil, del lado de su seña","De espaldas"],
  obj:["85 mm","50 mm","35 mm"]
};
const AYUDA = {
  "85 mm":"Un teleobjetivo corto suele deformar menos la cara que un angular.",
  "50 mm":"Suele dar proporciones naturales en cuerpo entero.",
  "35 mm":"Entra más entorno; de cerca puede agrandar la nariz.",
  "Ventana lateral suave":"Da algo de volumen a la cara sin sombras duras.",
  "Luz de estudio suave y pareja":"Pocas sombras; la cara puede verse más plana.",
  "Contraluz suave":"Separa del fondo; la cara queda más oscura.",
  "Gris claro liso":"Un fondo neutro ayuda a ver el contorno.",
  "Gris medio liso":"Prueba este si el pelo es muy claro.",
  "Blanco liso":"Limpio; los bordes claros pueden perderse.",
  "Foto natural, colores sin editar, grano fino":"Busca aspecto de foto real.",
  "Estudio limpio, colores neutros":"Más comercial, algo menos de textura.",
  "Ilustración":"Para personajes dibujados.",
  "Primer plano, cabeza y pelo enteros":"La cara grande y centrada.",
  "Plano medio corto, cabeza y hombros":"De lado y muy cerca los modelos tienden a inventar más.",
  "De pies a cabeza":"Para ver proporciones y vestuario.",
  "Tres cuartos, hacia el lado de su seña":"Ayuda a que la seña aparezca en su lado.",
  "Perfil, del lado de su seña":"El mismo lado que la seña."
};
const VISTAS = {
  retrato:{nombre:"Retrato", vista:"frontal", enc:OPC.enc[0], ang:OPC.ang[0], obj:"85 mm"},
  tres_cuartos:{nombre:"Tres cuartos", vista:"tres cuartos", enc:OPC.enc[1], ang:OPC.ang[1], obj:"85 mm"},
  perfil:{nombre:"Perfil", vista:"perfil", enc:OPC.enc[1], ang:OPC.ang[2], obj:"85 mm"},
  cuerpo_entero:{nombre:"Cuerpo entero", vista:"cuerpo entero", enc:OPC.enc[2], ang:OPC.ang[0], obj:"50 mm"},
  expresion:{nombre:"Expresiones", vista:"frontal", enc:OPC.enc[1], ang:OPC.ang[0], obj:"85 mm"}
};
const EXPRESIONES = ["Sonrisa amplia","Risa","Sorpresa","Seria","Pensativa"];
const USOS = [
  {id:"marca", t:"Retrato de marca", d:"Fotos de cara y medio cuerpo.", v:["tres_cuartos","cuerpo_entero"]},
  {id:"producto", t:"Fotos con producto", d:"Manos, ropa y cuerpo entero.", v:["cuerpo_entero","tres_cuartos"]},
  {id:"escenas", t:"Escenas con movimiento", d:"Se gira y se ve de lado.", v:["tres_cuartos","perfil","cuerpo_entero"]},
  {id:"expresiones", t:"Emociones fuertes", d:"Primeros planos con gesto.", v:["tres_cuartos","expresion"]}
];
const CAMPOS = [
  {k:"edad", t:"Edad aparente", ob:true, cons:true, ej:["25","40","65"]},
  {k:"procedencia", t:"Procedencia", ob:true, cons:true, ej:["Costa gallega","Norte de Europa","Latinoamericano","África occidental"]},
  {k:"complexion", t:"Complexión y altura", ob:false, cons:true, ej:["Delgada, 1,70 m","Robusta, 1,80 m"]},
  {k:"cara", t:"Cara, en 3 o 4 palabras", ob:true, cons:true, ej:["Alargada, nariz recta, labios finos","Cuadrada, mandíbula ancha, arrugas marcadas"]},
  {k:"pelo", t:"Pelo", ob:true, cons:true, ej:["Canoso, corto, peinado hacia atrás","Castaño oscuro, ondulado, por los hombros"]},
  {k:"ojos", t:"Ojos", ob:false, cons:true, ej:["Azul grisáceo (NO marrones)","Verde oliva (NO marrones)"]},
  {k:"senas", t:"Señas, con su LADO", ob:false, cons:true, ej:["Cicatriz pequeña en la ceja IZQUIERDA","Lunar junto a la ceja DERECHA"]},
  {k:"vestuario", t:"Vestuario base", ob:true, cons:false, ej:["Jersey verde oscuro y camisa de cuadros","Chaqueta impermeable azul"]},
  {k:"accesorio", t:"Accesorio fijo", ob:false, cons:true, ej:["Gorra de lana azul","Colgante de plata fino"]}
];
const PASOS = ["Receta","Origen","Personaje","Lo que falta","Vistas","Dirección","Qué se envía"];

function camposVacios(){ const c={}; CAMPOS.forEach(x=>c[x.k]={v:"", cons:x.cons, omit:false}); return c; }
function camposMarta(){
  const c=camposVacios();
  c.edad.v="34"; c.procedencia.v="Costa gallega"; c.complexion.v="Delgada, 1,68 m";
  c.cara.v="Ovalada, pómulos marcados, mentón estrecho"; c.pelo.v="Castaño oscuro, ondulado, por los hombros";
  c.ojos.v="Verde oliva (NO marrones)"; c.vestuario.v="Jersey de lana gris y chaqueta impermeable azul";
  return c;
}
function nuevo(){
  return {
    tab:"director", panel:true, paso:0, origen:null, nombre:"", real:false, campos:camposVacios(),
    uso:null, vistas:[], expr:["Sonrisa amplia"], modo:"hoja", vistaDir:null, dirAbierta:false, pruebasAbiertas:false,
    hoja:{fondo:OPC.fondo[0], luz:OPC.luz[0], acabado:OPC.acabado[0]},
    preparado:false, precioPreparado:null, precio:0.15, presupuesto:5,
    tomas:[], lotes:[], sel:null, n:0, rev:1, principal:null,
    ficha:{publicada:null, borrador:null, refs:[], direccionHoja:null},
    gastoEst:0, gastoRes:0,
    pr:{drift:false, fallo:false, incierta:false, corte:false, irregular:false},
    modal:null, accionBarra:null
  };
}
let S = nuevo();
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }
const C = k => S.campos[k];
const tienePrincipal = () => !!S.principal;
const nombreP = () => S.nombre || "El personaje";
function fichaTxt(){
  const f=S.ficha;
  if (f.publicada && f.borrador) return "v"+f.publicada+" publicada · borrador v"+f.borrador;
  if (f.publicada) return "v"+f.publicada+" publicada";
  return "borrador v"+(f.borrador||1)+" sin publicar";
}
const publicadaEn = v => !!(S.ficha.publicada && v && S.ficha.publicada>=v);
function resumenConservar(){
  const p=[], v=[];
  CAMPOS.forEach(x=>{ const c=C(x.k); if (!c.v) return;
    const t = x.k==="edad" ? c.v+" años" : x.k==="accesorio" ? "SIEMPRE lleva "+c.v.charAt(0).toLowerCase()+c.v.slice(1) : ({procedencia:"Procedencia",cara:"Cara",pelo:"Pelo",ojos:"Ojos",vestuario:"Ropa"}[x.k] ? {procedencia:"Procedencia",cara:"Cara",pelo:"Pelo",ojos:"Ojos",vestuario:"Ropa"}[x.k]+": "+c.v : c.v);
    (c.cons?p:v).push(t); });
  return {conserva:p, varia:v};
}
function vistasPara(uso){
  const u=USOS.find(x=>x.id===uso);
  return ["tres_cuartos","perfil","cuerpo_entero","expresion"].map(k=>({clave:k, marcada:u.v.includes(k), enc:VISTAS[k].enc, ang:VISTAS[k].ang, obj:VISTAS[k].obj, exc:false, luz:S.hoja.luz, fondo:S.hoja.fondo}));
}
function unidadesVistas(){
  const out=[];
  S.vistas.filter(v=>v.marcada).forEach(v=>{
    if (v.clave==="expresion") S.expr.forEach(e=>out.push({v, clave:"expresion:"+e, vista:"frontal", expresion:e.toLowerCase(), nombre:"Expresión: "+e.toLowerCase()}));
    else out.push({v, clave:v.clave, vista:VISTAS[v.clave].vista, expresion:null, nombre:VISTAS[v.clave].nombre});
  });
  return out;
}
const VIVO = ["lista","generando","incierta","preparada"];
function cubierta(clave){
  return S.tomas.some(t=>t.clave===clave && !t.desc && !t.reemplazada && VIVO.includes(t.estado) && (t.tipo==="vista"||t.tipo==="recorte"))
    || S.tomas.some(t=>t.tipo==="hoja" && !t.desc && !t.reemplazada && !t.recortada && VIVO.includes(t.estado) && t.paneles.some(p=>p.clave===clave))
    || S.ficha.refs.some(r=>r.clave===clave);
}
const pendientes = () => tienePrincipal() ? unidadesVistas().filter(u=>!cubierta(u.clave)) : [];
const retratoPendiente = () => !tienePrincipal() && !S.tomas.some(t=>t.tipo==="retrato" && !t.desc && VIVO.includes(t.estado));

function lineaPrincipal(){
  const vest=C("vestuario"), lleva = vest.cons && vest.v;
  return "Imagen 1: referencia principal de "+nombreP()+". Conserva su cara, pelo, tono de piel y complexión"+(lleva?" y su ropa: "+vest.v.charAt(0).toLowerCase()+vest.v.slice(1):"")+". "+(lleva?"No copies la pose, el encuadre ni el fondo.":"No copies su ropa, la pose, el encuadre ni el fondo.");
}
function refsDe(u){
  const r=[{n:1, que:"Referencia principal", para:lineaPrincipal()}];
  if (u && u.expresion && C("vestuario").cons && S.ficha.refs.some(x=>x.clave==="cuerpo_entero"))
    r.push({n:2, que:"Cuerpo entero aprobado", para:"Imagen 2: cuerpo entero aprobado de "+nombreP()+"; úsalo para la ropa y las proporciones. No copies la pose."});
  return r;
}
const dirLinea = v => "Encuadre: "+v.enc+". Ángulo: "+v.ang+". Objetivo: "+v.obj+". Luz: "+(v.exc?v.luz:S.hoja.luz)+". Fondo: "+(v.exc?v.fondo:S.hoja.fondo)+". Acabado: "+S.hoja.acabado+".";
function rasgosLinea(){
  if (S.real) return nombreP()+" es una persona real: su cara se toma de la imagen 1, no de este texto.";
  const r=resumenConservar();

function figura(clave, drift, expr){

  const ropa = verde && !drift ? "#2F4A35" : "#7d8790";
  const son = expr && /sonrisa|risa/.test(expr), sor = expr && /sorpresa/.test(expr);
  const boca = sor ? '<ellipse cx="0" cy="22" rx="5" ry="7" fill="#7a3d33"/>' : son ? '<path d="M-11 18 Q0 30 11 18" stroke="#7a3d33" stroke-width="3" fill="none"/>' : '<path d="M-9 21 L9 21" stroke="#7a3d33" stroke-width="3"/>';
  let cab;
  if (clave==="perfil") cab='<g transform="translate(150 150)"><path d="M-40 -60 Q20 -95 48 -40 Q60 0 40 50 L-30 55 Z" fill="'+pelo+'"/><path d="M-20 -55 Q45 -65 50 0 Q58 10 52 18 Q48 40 30 55 L-25 60 Q-35 0 -20 -55Z" fill="'+piel+'"/><circle cx="28" cy="-8" r="3.5" fill="#2c3b2a"/></g>';
  else { const g=clave==="tres_cuartos"?12:0, ce=clave==="cuerpo_entero";
    cab='<g transform="translate('+(150+g)+' '+(ce?72:150)+') scale('+(ce?0.38:1)+')"><ellipse cx="0" cy="-8" rx="62" ry="78" fill="'+pelo+'"/><ellipse cx="'+g/2+'" cy="4" rx="46" ry="60" fill="'+piel+'"/><circle cx="'+(-16+g)+'" cy="-6" r="4" fill="#2c3b2a"/><circle cx="'+(16+g)+'" cy="-6" r="4" fill="#2c3b2a"/>'+(drift?'':'<path d="M'+(-30+g)+' -26 l10 3" stroke="#6b4a3a" stroke-width="2"/>')+'<g transform="translate('+g+' 0)">'+boca+'</g></g>'; }
  const cue = clave==="cuerpo_entero" ? '<rect x="126" y="100" width="48" height="130" rx="16" fill="'+ropa+'"/><rect x="130" y="224" width="17" height="150" rx="8" fill="#3d4652"/><rect x="153" y="224" width="17" height="150" rx="8" fill="#3d4652"/>' : '<path d="M60 400 Q70 250 150 240 Q230 250 240 400Z" fill="'+ropa+'"/>'+(verde&&!drift?'<path d="M135 245 L150 290 L165 245" fill="#8a3b34"/>':'');
  return '<rect width="300" height="400" fill="#A7A39E"/>'+cue+cab;
}
const svgFigura = (clave, et, drift, expr) => '<svg viewBox="0 0 300 400" role="img" aria-label="Imagen simulada">'+figura(clave,drift,expr)+'<text x="12" y="390" font-size="13" fill="#3a3a3a" font-family="Mulish,sans-serif">simulada · '+esc(et)+'</text></svg>';
function svgHoja(t){

  g.forEach(x=>{ h+='<div class="tarjeta"><div class="t"><b>'+esc(x.nombre)+'</b><span class="precio">'+euro(S.precio)+'</span></div><span>'+esc(x.resumen)+'</span><span class="ayuda">'+(x.refs.length?x.refs.map(r=>'Imagen '+r.n+': '+r.que).join(" · "):'Sin imágenes: se genera desde los campos')+'</span><details><summary>Ver el texto completo</summary><pre>'+esc(x.texto)+'</pre><p class="ayuda" style="margin-top:6px">'+MODELO+' · tarifa verificada el '+TARIFA_FECHA+' · calidad para hojas de personaje sin validar</p></details></div>'; });

function siguiente(){
  if (S.accionBarra) return {msg:S.accionBarra.msg, a:"ejecutarBarra", label:S.accionBarra.boton, sec:"cancelarBarra", secLabel:"Cancelar"};
  const gen=S.tomas.filter(t=>t.estado==="generando").length;
  if (gen) return {msg:"Generando "+gen+(gen===1?" imagen…":" imágenes…")};
  const inc=S.tomas.filter(t=>t.estado==="incierta");
  if (inc.length) return {msg:inc.length+" petición sin confirmar", sub:"Puede haber un cargo.", a:"comprobarTodas", label:"Comprobar"};
  const prep=S.tomas.filter(t=>t.estado==="preparada");
  if (prep.length) return {msg:prep.length+" generaciones preparadas sin autorizar", sub:"Quedaron así al recargar.", a:"autorizarPreparadas", label:"Autorizar "+prep.length+" · "+euro(prep.length*S.precio)};
  const fall=S.tomas.filter(t=>t.estado==="fallida"&&!t.reemplazada);
  if (fall.length) return {msg:fall.length+(fall.length===1?" generación falló":" generaciones fallaron"), a:"faltan", label:"Generar "+(fall.length===1?"la que falta":"las que faltan")+" · "+euro(fall.length*S.precio)};
  if (S.tomas.some(t=>t.tipo==="retrato"&&t.estado==="lista"&&!t.desc) && !tienePrincipal()){ const c=cur(); return (c&&c.tipo==="retrato"&&!c.desc&&S.tab==="imagen") ? {msg:"Revisa y elige la referencia principal para continuar", a:"elegirPrincipal", label:"Elegir como referencia principal", sec:"otroRetrato", secLabel:"Generar otro · "+euro(S.precio)} : {msg:"Revisa y elige la referencia principal para continuar", a:"verRetrato", label:"Ver el retrato"}; }
  if (S.tomas.some(t=>t.tipo==="hoja"&&t.estado==="lista"&&!t.recortada&&!t.desc)) return {msg:"Revisa la hoja y recórtala en vistas", a:"verHoja", label:"Revisar la hoja"};
  const rev=S.tomas.filter(t=>t.estado==="lista"&&!t.desc&&!t.v&&!t.reemplazada&&(t.tipo==="vista"||t.tipo==="recorte"));
  if (rev.length) return {msg:"Revisa "+rev.length+(rev.length===1?" imagen":" imágenes"), sub:"Aprueba para el borrador las que valgan.", a:"revisarSiguiente", label:"Revisar la siguiente"};
  const g=generaciones();
  if (S.preparado && g.length) return {msg:g[0].tipo==="retrato"?"Listo: retrato para elegir la referencia principal":"Listo para generar", a:"generar", label:etiquetaGenerar(g), sec:"editarPrep", secLabel:"Editar preparación"};
  if (tienePrincipal() && S.uso && g.length) return {msg:(S.origen==="desc"&&!S.tomas.some(t=>t.tipo!=="retrato")?"Referencia principal elegida. ":"")+"Faltan "+pendientes().length+" vistas", a:"continuarVistas", label:"Continuar con las vistas pendientes"};
  if (S.ficha.borrador && S.ficha.refs.some(r=>r.v===S.ficha.borrador)) return {msg:"Todo revisado", sub:"Las imágenes aprobadas están en el borrador v"+S.ficha.borrador+".", a:"verFicha", label:"Revisar y publicar la ficha v"+S.ficha.borrador};
  if (S.ficha.publicada && S.tomas.length) return {msg:"Ficha de "+nombreP()+" v"+S.ficha.publicada+" publicada", a:"prepararOtra", label:"Preparar otra vista"};
  if (!S.origen && S.paso===0) return {msg:"Elige qué quieres preparar en el panel del Director", a:S.panel?null:"abrirPanel", label:"Abrir el Director"};
  return {msg:"Siguiente: «"+PASOS[S.paso]+"» en el panel del Director", a:S.panel?null:"abrirPanel", label:"Abrir el Director"};
}

function lanzar(gs){
  S.rev++; const lote="L"+(S.lotes.length+1), corte=S.pr.corte;
  gs.forEach((g,i)=>{
    S.n++;
    const base={id:"t"+S.n, n:S.n, fav:false, desc:false, motivo:null, v:null, drift:false, reemplazada:false, lote, hist:[]};
    let t;
    if (g.tipo==="retrato") t={...base, tipo:"retrato", vclave:"retrato", clave:"retrato", nombre:"Retrato", vista:"frontal", expresion:null, texto:g.texto};
    else if (g.tipo==="hoja") t={...base, tipo:"hoja", vclave:"hoja", clave:"hoja", nombre:"Hoja · "+g.us.length+" vistas", paneles:g.us.map(u=>({vclave:u.v.clave, clave:u.clave, vista:u.vista, expresion:u.expresion, nombre:u.nombre})), texto:g.texto, irregular:S.pr.irregular};
    else t={...base, tipo:"vista", vclave:g.u.v.clave, clave:g.u.clave, nombre:g.u.nombre, vista:g.u.vista, expresion:g.u.expresion, texto:g.texto};
    t.idp="sesion:pic05:"+t.clave.replace(/\s/g,"_")+":"+S.rev;
    if (S.pr.drift && i===0) t.drift=true;
    if (S.pr.fallo && i===gs.length-1) t.fin="fallida"; else if (S.pr.incierta && i===gs.length-1) t.fin="incierta";
    if (corte && i>0){ t.estado="preparada"; t.hist.push("Preparada en "+lote+"; sin autorizar al recargar"); }
    else { t.estado="generando"; S.gastoRes+=S.precio; t.hist.push(lote+": "+euro(S.precio)+" reservado al autorizar · "+t.idp); }
    S.tomas.push(t);
  });
  S.lotes.push({id:lote, total:red(gs.length*S.precio)});
  S.pr={drift:false,fallo:false,incierta:false,corte:false,irregular:false};
  S.gastoRes=red(S.gastoRes); S.preparado=false; S.precioPreparado=null;
  if (corte) setTimeout(()=>acciones.cerrarVolver(),50); else setTimeout(terminar,1000);
}
function terminar(){
  let c=false;
  S.tomas.forEach(t=>{ if (t.estado!=="generando") return; c=true;
    if (t.fin==="fallida"){ t.estado="fallida"; S.gastoRes-=S.precio; t.hist.push("Rechazada: reserva liberada"); }
    else if (t.fin==="incierta"){ t.estado="incierta"; t.hist.push("Sin respuesta: reserva mantenida"); }
    else { t.estado="lista"; S.gastoRes-=S.precio; S.gastoEst+=S.precio; t.hist.push("Completada: "+euro(S.precio)+" estimado"); }
    delete t.fin; });
  S.gastoRes=red(S.gastoRes); S.gastoEst=red(S.gastoEst);
  if (c) render();
}

    const total=g.length*S.precio, queda=S.presupuesto-S.gastoEst-S.gastoRes;
    if (S.precioPreparado!==null && S.precioPreparado!==S.precio){ S.modal={tipo:"confirmar", titulo:"El precio ha cambiado", texto:"Al preparar era "+euro(S.precioPreparado)+" por imagen; ahora es "+euro(S.precio)+". Total: "+euro(total)+".", boton:"Generar por "+euro(total), accion:"confirmarGenerar"}; return; }
    if (total>queda+1e-9){ S.modal={tipo:"confirmar", titulo:"Supera el presupuesto", texto:"Esta generación cuesta "+euro(total)+" y quedan "+euro(Math.max(0,queda))+" del presupuesto.", boton:"Generar igualmente · "+euro(total), accion:"confirmarGenerar"}; return; }
    lanzar(g);
  },
  confirmarGenerar(){ S.modal=null; lanzar(generaciones()); },
  autorizarPreparadas(){ S.tomas.filter(t=>t.estado==="preparada").forEach(t=>{ t.estado="generando"; S.gastoRes+=S.precio; t.hist.push("Autorizada tras recargar: "+euro(S.precio)+" reservado"); }); S.gastoRes=red(S.gastoRes); setTimeout(terminar,1000); },
  faltan(){
    const gs=[];
    S.tomas.filter(t=>t.estado==="fallida"&&!t.reemplazada).forEach(t=>{ t.reemplazada=true;
      if (t.tipo==="retrato") gs.push({tipo:"retrato", texto:textoRetrato()});
      else if (t.tipo==="hoja") gs.push({tipo:"hoja", us:t.paneles.map(p=>({v:S.vistas.find(v=>v.clave===p.vclave), clave:p.clave, vista:p.vista, expresion:p.expresion, nombre:p.nombre})), texto:t.texto});
      else { const u=unidadesVistas().find(x=>x.clave===t.clave); if (u) gs.push({tipo:"vista", u, texto:textoVista(u)}); } });
    if (gs.length) lanzar(gs);
  },
  comprobar(){ const t=cur(); t.estado="lista"; S.gastoRes=red(S.gastoRes-S.precio); S.gastoEst=red(S.gastoEst+S.precio); t.hist.push("Comprobada: estaba hecha"); },
  comprobarTodas(){ S.tomas.filter(t=>t.estado==="incierta").forEach(t=>{ t.estado="lista"; S.gastoRes=red(S.gastoRes-S.precio); S.gastoEst=red(S.gastoEst+S.precio); t.hist.push("Comprobada: estaba hecha"); }); },
  sel(el){ abrirToma(S.tomas.find(x=>x.id===el.dataset.id)); },
  tab(el){ S.tab=el.dataset.v; },
  abrirPanel(){ S.panel=true; S.tab="director"; },
  cerrarPanel(){ S.panel=false; },
  verRetrato(){ abrirToma(S.tomas.find(x=>x.tipo==="retrato"&&x.estado==="lista"&&!x.desc)); },
  verHoja(){ abrirToma(S.tomas.find(x=>x.tipo==="hoja"&&x.estado==="lista"&&!x.recortada&&!x.desc)); },
  revisarSiguiente(){ abrirToma(S.tomas.find(x=>x.estado==="lista"&&!x.desc&&!x.v&&!x.reemplazada&&(x.tipo==="vista"||x.tipo==="recorte"))); },
  elegirPrincipal(){ const t=cur(), v=asegurarBorrador(); S.principal=t.id; t.v=v; S.ficha.refs.push({v, clave:"retrato", vista:"frontal", expresion:null, ancla:true, n:t.n}); t.hist.push("Elegida como referencia principal · borrador v"+v); toast("Referencia principal elegida. Queda en el borrador v"+v+", sin publicar."); },
  otroRetrato(){ const t=cur(); t.desc=true; lanzar([{tipo:"retrato", texto:textoRetrato()}]); },
  descartar(){ const t=cur(); t.desc=true; t.hist.push("Descartada"); },
  recuperar(){ const t=cur(); t.desc=false; t.motivo=null; t.hist.push("Recuperada"); },
  continuarVistas(){ S.tab="director"; S.panel=true; S.paso=6; S.preparado=true; S.precioPreparado=S.precio; },
  recortar(){
    const t=cur();
    if (t.irregular){ S.modal={tipo:"confirmar", titulo:"La hoja no tiene paneles iguales", texto:"El último panel no ocupa lo mismo que los demás y un recorte igual lo cortaría mal. Te propongo generar esas vistas una a una.", boton:"Pasar a vistas sueltas", accion:"aSueltas"}; return; }
    t.recortada=true; t.hist.push("Recortada en "+t.paneles.length+" vistas (local, sin coste)");
    const w=Math.round(2048/t.paneles.length);
    t.paneles.forEach(p=>{ S.n++; S.tomas.push({id:"t"+S.n, n:S.n, tipo:"recorte", vclave:p.vclave, clave:p.clave, nombre:p.nombre+" (recorte)", vista:p.vista, expresion:p.expresion, estado:"lista", fav:false, desc:false, motivo:null, v:null, drift:t.drift, reemplazada:false, lote:t.lote, idp:t.idp+":recorte", res:w+" × 1 152 px", texto:"Recorte de T"+t.n+".", hist:["Recorte de T"+t.n+" · "+w+" × 1 152 px, sin coste"]}); });
    toast("Hoja recortada en "+t.paneles.length+" vistas. Revisa cada una.");
  },
  otraHoja(){ const t=cur(); t.desc=true; S.modo="hoja"; S.tab="director"; S.paso=6; S.preparado=true; S.precioPreparado=S.precio; },
  aSueltas(){ const t=S.tomas.find(x=>x.tipo==="hoja"&&!x.recortada&&!x.desc); if (t) t.desc=true; S.modo="sueltas"; S.modal=null; S.tab="director"; S.panel=true; S.paso=6; S.preparado=true; S.precioPreparado=S.precio; },
  aprobar(){ const t=cur(), v=asegurarBorrador(); t.v=v; S.ficha.refs.push({v, clave:t.clave, vista:t.vista, expresion:t.expresion, ancla:false, n:t.n, res:t.res||null}); t.hist.push("Aprobada para el borrador v"+v+" (no marca ★)"); S.modal=null; },
  quitarBorrador(){ const t=cur(); S.ficha.refs=S.ficha.refs.filter(r=>r.n!==t.n); t.v=null; t.hist.push("Quitada del borrador"); },
  ampliar(){ const t=cur(); S.accionBarra={msg:"Ampliar «"+t.nombre.replace(" (recorte)","")+"» como imagen suelta, a resolución completa.", boton:"Generar 1 vista · "+euro(S.precio), tipo:"ampliar", id:t.id}; },
  fav(){ const t=cur(); t.fav=!t.fav; },
  comparar(){ S.modal={tipo:"comparar", id:S.sel}; },
  noid(){ const t=cur(); t.desc=true; t.motivo="identidad"; t.hist.push("No mantiene la identidad; el medio se conserva"); S.modal=null; },
  corregir(){ const t=cur(); S.accionBarra={msg:"Corregir T"+t.n+" con la referencia principal: «cambia solo la cara».", boton:"Aplicar cambio · "+euro(S.precio), tipo:"corregir", id:t.id}; },
  revdir(){ const t=cur(); S.tab="director"; S.paso=5; S.vistaDir=t.vclave; S.dirAbierta=true; },
  regenerar(){ const t=cur(); S.accionBarra={msg:"Volver a generar «"+t.nombre+"».", boton:"Generar 1 vista · "+euro(S.precio), tipo:"regenerar", id:t.id}; },
  cancelarBarra(){ S.accionBarra=null; },
  ejecutarBarra(){
    const a=S.accionBarra, t=S.tomas.find(x=>x.id===a.id); S.accionBarra=null;
    const u=unidadesVistas().find(x=>x.clave===t.clave) || {v:{...VISTAS[t.vclave], clave:t.vclave, exc:false}, clave:t.clave, vista:t.vista, expresion:t.expresion, nombre:t.nombre};
    if (a.tipo==="ampliar") t.reemplazada=true;
    lanzar([{tipo:"vista", u, texto:a.tipo==="corregir" ? "Cambia solo la cara para que sea la de la imagen 2. Mantén todo lo demás.\nImagen 1: T"+t.n+".\n"+lineaPrincipal().replace("Imagen 1","Imagen 2") : textoVista(u)}]);
  },
  verFicha(){ S.modal={tipo:"ficha"}; },
  publicar(){ const f=S.ficha; f.publicada=f.borrador; f.borrador=null; f.direccionHoja={...S.hoja}; S.modal=null; toast("Ficha de "+nombreP()+" v"+f.publicada+" publicada."); },
  prepararOtra(){ S.tab="director"; S.panel=true; S.paso=4; },
  costes(){ S.modal={tipo:"costes"}; },
  cerrarModal(){ S.modal=null; },
  prueba(el){ const k=el.dataset.v; if (k==="precio") S.precio = S.precio===0.15?0.17:0.15; else if (k==="presupuesto") S.presupuesto = S.presupuesto===5?0.2:5; else S.pr[k]=!S.pr[k]; },
  cero(){ S=nuevo(); try{ localStorage.removeItem(CLAVE); }catch(e){} },
  cerrarVolver(){
    const copia=JSON.stringify(S), v=document.createElement("div"); v.className="cerrado-velo"; v.textContent="Taller cerrado. Volviendo a abrir…"; document.body.appendChild(v);
    setTimeout(()=>{ S=JSON.parse(copia); S.modal=null; v.remove(); render(); toast("Recuperado. Siguiente: "+siguiente().msg+"."); if (S.tomas.some(t=>t.estado==="generando")) setTimeout(terminar,900); },700);
    return "noRender";
  }
};

const DE_CAMBIO=["marcar","real","cons","campo","nombre","h-fondo","h-luz","h-acabado","v-enc","v-ang","v-obj","v-exc","v-luz","v-fondo"];
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if (!el) return;
  if (el.classList.contains("velo") && e.target.closest("[data-stop]")) return;
  const a=el.dataset.a;
  if (DE_CAMBIO.includes(a) || el.disabled) return;
  const r=acciones[a] && acciones[a](el);
  if (r!=="noRender") render();
});
document.addEventListener("change",e=>{ const el=e.target, a=el.dataset&&el.dataset.a; if (!DE_CAMBIO.includes(a)) return; acciones[a](el); if ((a==="campo"||a==="nombre") && S.paso===2) return; render(); });
document.addEventListener("input",e=>{ const el=e.target, a=el.dataset&&el.dataset.a; if (a==="campo"){ C(el.dataset.k).v=el.value.trim(); guardar(); } else if (a==="nombre"){ S.nombre=el.value.trim(); guardar(); } });
document.addEventListener("toggle",e=>{ if (e.target.id==="det-pruebas") S.pruebasAbiertas=e.target.open; if (e.target.id==="det-dir") S.dirAbierta=e.target.open; guardar(); }, true);
document.addEventListener("keydown",e=>{ if (e.key==="Escape"&&S.modal){ S.modal=null; render(); } });

try{ const g=localStorage.getItem(CLAVE); if (g){ const x=JSON.parse(g); if (x&&x.tomas){ S=x; S.modal=null; if (S.tomas.some(t=>t.estado==="generando")) setTimeout(terminar,900); } } }catch(e){}
render();
})();
</script>
