<style>
/* Mesa a pantalla completa + lateral único a la derecha + barra inferior; paleta oscura aprobada en PIC-01 D11 */
:root{
  --fondo:#141414; --mesa:#191919; --panel:#222222; --campo:#2B2B2B; --borde:#3D3D3D;
  --tinta:#F5F0E8; --tinta2:#B8B2A9; --ambar:#F5A623; --ambar2:#FFB740; --sobre-ambar:#191919;
  --error:#E57373; --exito:#81B88B; --piel:#C9A184; --pelo:#3B2A22; --ropa:#4A5A6A;
  --f:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--f);font-size:14px;line-height:1.45}
button,select,textarea,input{font-family:inherit;font-size:13px;color:var(--tinta)}
button{cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--panel);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top b{font-size:15px}
.ruta{color:var(--tinta2);font-size:13px}
.carpetas{display:flex;gap:4px;flex-wrap:wrap}
.pest{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--tinta2)}
.pest.on{background:var(--campo);color:var(--tinta);font-weight:700;box-shadow:inset 0 -2px 0 var(--ambar)}
.gasto{margin-left:auto;font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.gasto b{color:var(--tinta)}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--borde);background:var(--campo)}
.btn:hover{border-color:var(--tinta2)}
.btn.amb{background:var(--ambar);border-color:var(--ambar);color:var(--sobre-ambar);font-weight:700}
.btn.amb:hover{background:var(--ambar2)}
.btn.chico{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.txt{background:none;border-color:transparent;color:var(--ambar);padding:0 4px}
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border-top:1px solid var(--borde);border-bottom:1px solid var(--borde);font-size:12px;color:var(--tinta2);padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto .btn{height:24px;font-size:12px;padding:0 9px}
.proto .btn.armado{border-color:var(--error);color:var(--error)}
.cuerpo{flex:1;display:flex;flex-wrap:wrap;min-height:0}
main.mesa{flex:1 1 520px;min-width:0;background:var(--mesa);background-image:radial-gradient(#262626 1px,transparent 1px);background-size:22px 22px;padding:20px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.mesa h2{margin:0;font-size:16px;font-weight:800;text-wrap:balance}
.mesa .sub{color:var(--tinta2);font-size:13px;margin:0}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.toma{background:var(--panel);border:1px solid var(--borde);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left}
.toma.sel{border-color:var(--ambar);box-shadow:0 0 0 1px var(--ambar)}
.toma.desc{opacity:.5}
.toma .marco{aspect-ratio:3/4;max-width:100%;border-radius:6px;background:#9A9590;overflow:hidden;position:relative}
.toma .marco svg{width:100%;height:100%;display:block}
.toma .cab{display:flex;align-items:center;gap:6px;font-size:12px}
.toma .cab b{font-size:13px}
.estrella{margin-left:auto;color:var(--ambar)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;font-size:11px;background:var(--campo);color:var(--tinta2);border:1px solid var(--borde)}
.chip.ficha{color:var(--exito);border-color:#4f6e55}
.chip.err{color:var(--error);border-color:#7a4545}
.chip.gen{color:var(--ambar);border-color:#7a5a20}
.vacio{border:1px dashed var(--borde);border-radius:10px;padding:28px 18px;color:var(--tinta2);text-align:center;max-width:560px}
aside.lat{flex:0 1 400px;min-width:0;background:var(--panel);border-left:1px solid var(--borde);display:flex;flex-direction:column}
@media (max-width:900px){aside.lat{flex:1 1 100%;border-left:none;border-top:1px solid var(--borde)}}
.tabs{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--borde)}
.tab{height:30px;padding:0 10px;border-radius:8px;border:none;background:none;color:var(--tinta2)}
.tab.on{background:var(--campo);color:var(--tinta);font-weight:700;box-shadow:inset 0 -2px 0 var(--ambar)}
.latc{padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.contexto{font-size:12px;color:var(--tinta2)}
.contexto b{color:var(--tinta)}
.pasos{display:flex;flex-wrap:wrap;gap:4px}
.paso{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--borde);background:none;color:var(--tinta2)}
.paso.on{border-color:var(--ambar);color:var(--ambar)}
.paso.hecho{color:var(--tinta)}
h3{margin:0;font-size:15px;font-weight:800}
.ayuda{margin:0;color:var(--tinta2);font-size:12.5px}
.bloque{background:var(--campo);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.opcion{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--campo);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;width:100%}
.opcion:hover{border-color:var(--tinta2)}
.opcion.on{border-color:var(--ambar)}
.opcion small{display:block;color:var(--tinta2);font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col h4{margin:0 0 6px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--tinta2)}
.rasgo{display:flex;align-items:center;gap:6px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:5px 6px 5px 8px;font-size:12.5px;margin-bottom:5px}
.rasgo span{flex:1;min-width:0}
.rasgo button{height:22px;width:24px;border-radius:6px;border:1px solid var(--borde);background:var(--campo);font-size:12px;padding:0}
textarea{width:100%;min-height:96px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:8px;resize:vertical;line-height:1.45}
select{width:100%;height:30px;background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:0 6px}
.dirfila{display:grid;grid-template-columns:78px 1fr;gap:6px 8px;align-items:center;font-size:12.5px}
.porque{grid-column:2;color:var(--tinta2);font-size:11.5px;margin-top:-2px}
.director{font-size:11px;color:var(--ambar)}
.tarjeta{border:1px solid var(--borde);border-radius:10px;padding:10px 12px;background:var(--campo);display:flex;flex-direction:column;gap:6px}
.tarjeta pre{white-space:pre-wrap;margin:0;font-family:inherit;font-size:12px;color:var(--tinta);background:var(--fondo);border-radius:6px;padding:8px;max-height:150px;overflow:auto}
.imgs{font-size:12px;color:var(--tinta2);display:flex;flex-direction:column;gap:3px}
.fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.precio{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;padding:8px 2px;border-top:1px solid var(--borde)}
.aviso{font-size:12px;color:var(--tinta2);border-left:3px solid var(--ambar);padding:6px 10px;background:var(--fondo);border-radius:0 6px 6px 0}
.aviso.err{border-left-color:var(--error)}
.aviso.ok{border-left-color:var(--exito)}
.hist{margin:0;padding-left:16px;font-size:12px;color:var(--tinta2)}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--panel);border-top:1px solid var(--borde);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.alcance{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--campo);border:1px solid var(--borde)}
.barra .msg{flex:1;min-width:200px;color:var(--tinta2);font-size:12.5px}
.velo{position:fixed;inset:0;background:rgba(10,10,10,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--panel);border:1px solid var(--borde);border-radius:12px;width:min(860px,100%);max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.par{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.par .marco{aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#9A9590}
.par svg{width:100%;height:100%;display:block}
.lista{margin:0;padding-left:18px;font-size:12.5px;color:var(--tinta2);columns:2;column-gap:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--campo);border:1px solid var(--ambar);border-radius:10px;padding:10px 14px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.cerrado{position:fixed;inset:0;background:var(--fondo);display:flex;align-items:center;justify-content:center;color:var(--tinta2);z-index:40}
@media (prefers-reduced-motion:no-preference){.toma.generando .marco{animation:latido 1.2s ease-in-out infinite}}
@keyframes latido{50%{opacity:.55}}
</style>

<div class="app" id="app"></div>

<script>
(function(){
const PRECIO = 0.15;
const MODELO = "Nano Banana Pro (fal)";
const MODELO_NOTA = "admite 6 referencias y edición · calidad para hojas de personaje: sin validar";
const TARIFA = "tarifa verificada el 14-11-2026";
const PRESUPUESTO = 5.00;
const MAX_REFS = 6;
const CLAVE = "picasso.pic05.maqueta.r2";

const $ = s => document.querySelector(s);
const euro = n => n.toFixed(2).replace(".", ",") + " $";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const redondo = n => Math.max(0, Math.round(n*100)/100);

const OPC = {
  fondo:["Gris claro liso","Blanco liso","Gris medio liso"],
  luz:["Ventana lateral suave","Luz de estudio suave y pareja","Contraluz suave"],
  acabado:["Foto natural, colores sin editar, grano fino","Estudio limpio, colores neutros","Ilustración (solo si no es fotorrealista)"],
  encuadre:["Primer plano, cabeza y pelo enteros","Plano medio corto, cabeza y hombros","De pies a cabeza","Plano medio"],
  angulo:["Frontal, a la altura de los ojos","Tres cuartos, hacia su lado derecho","Perfil, lado derecho","De espaldas","Ligeramente picado"],
  objetivo:["85 mm","50 mm","35 mm"]
};
const PORQUE = {
  "85 mm":"No deforma la nariz y se leen bien los rasgos.",
  "50 mm":"Proporciones naturales del cuerpo entero.",
  "35 mm":"Más entorno; deforma algo la cara si te acercas.",
  "Ventana lateral suave":"Da volumen a la cara sin sombras duras.",
  "Luz de estudio suave y pareja":"Sin sombras; la cara se lee plana.",
  "Contraluz suave":"Separa del fondo; la cara queda más oscura.",
  "Gris claro liso":"El blanco quema los bordes del pelo; el gris no.",
  "Blanco liso":"Limpio, pero se pierden los bordes claros.",
  "Gris medio liso":"Bueno para pelo muy claro.",
  "Foto natural, colores sin editar, grano fino":"Parece una foto real; evita la piel de plástico.",
  "Estudio limpio, colores neutros":"Más comercial; algo menos de textura.",
  "Ilustración (solo si no es fotorrealista)":"Para personajes dibujados.",
  "Primer plano, cabeza y pelo enteros":"La cara grande y centrada: es el ancla.",
  "Plano medio corto, cabeza y hombros":"Nunca primer plano de lado: es donde más se inventa.",
  "De pies a cabeza":"Proporciones y vestuario base.",
  "Plano medio":"Pose y manos.",
  "Frontal, a la altura de los ojos":"Sin deformar ni dar intención.",
  "Tres cuartos, hacia su lado derecho":"Gira hacia la seña para fijarla.",
  "Perfil, lado derecho":"El mismo lado que la seña.",
  "De espaldas":"Pelo y vestuario por detrás.",
  "Ligeramente picado":"Suaviza; no conviene en una referencia."
};
const VISTAS = {
  ancla:{nombre:"Retrato ancla", vista:"frontal", enc:"Primer plano, cabeza y pelo enteros", ang:"Frontal, a la altura de los ojos", obj:"85 mm"},
  tres_cuartos:{nombre:"Tres cuartos", vista:"tres cuartos", enc:"Plano medio corto, cabeza y hombros", ang:"Tres cuartos, hacia su lado derecho", obj:"85 mm"},
  perfil:{nombre:"Perfil", vista:"perfil", enc:"Plano medio corto, cabeza y hombros", ang:"Perfil, lado derecho", obj:"85 mm"},
  cuerpo_entero:{nombre:"Cuerpo entero", vista:"cuerpo entero", enc:"De pies a cabeza", ang:"Frontal, a la altura de los ojos", obj:"50 mm"},
  expresion:{nombre:"Expresiones", vista:"frontal", enc:"Plano medio corto, cabeza y hombros", ang:"Frontal, a la altura de los ojos", obj:"85 mm"}
};
const EXPRESIONES = ["Neutra","Sonrisa amplia","Risa","Sorpresa","Seria","Pensativa"];
const USOS = [
  {id:"marca", t:"Retrato de marca", d:"Fotos de cara y medio cuerpo.", v:["tres_cuartos","cuerpo_entero"]},
  {id:"producto", t:"Fotos con producto", d:"Manos, vestuario y cuerpo entero.", v:["cuerpo_entero","tres_cuartos"]},
  {id:"escenas", t:"Escenas con movimiento", d:"Se gira, se ve de lado.", v:["tres_cuartos","perfil","cuerpo_entero"]},
  {id:"expresiones", t:"Emociones fuertes", d:"Primeros planos con gesto.", v:["tres_cuartos","expresion"]}
];
const PASOS = ["Receta","Origen","Identidad","Lo que falta","Uso y vistas","Dirección","Qué se envía"];

function rasgosMarta(){
  return [
    {id:"r1",t:"Mujer de unos 34 años, origen gallego",c:"fijo"},
    {id:"r2",t:"Cara ovalada, pómulos marcados, mentón estrecho",c:"fijo"},
    {id:"r3",t:"Pelo castaño oscuro, ondulado, por los hombros",c:"fijo"},
    {id:"r4",t:"Ojos verde oliva (NO marrones)",c:"fijo"},
    {id:"r5",t:"Complexión delgada, 1,68 m",c:"fijo"},
    {id:"r6",t:"Jersey de lana gris y chaqueta impermeable azul",c:"var"},
    {id:"r7",t:"Pelo recogido en coleta",c:"var"}
  ];
}
function preguntasMarta(){
  return [
    {id:"q1",q:"¿Tiene alguna seña en la piel? Dime de qué lado.",o:["Lunar pequeño junto a la ceja DERECHA","Pecas en la nariz","Ninguna"],r:null,campo:"fijo"},
    {id:"q2",q:"¿Lleva algo siempre?",o:["SIEMPRE lleva un colgante de plata fino","Gafas de pasta","Nada fijo"],r:null,campo:"fijo"},
    {id:"q3",q:"¿Maquillaje que se note?",o:["Sin maquillaje visible","Maquillaje natural"],r:null,campo:"fijo"}
  ];
}
function preguntasNuevo(){
  return [
    {id:"n1",q:"¿Qué edad aparenta y de dónde es?",o:["Unos 30, mediterráneo","Unos 50, del norte de Europa","Unos 20, latinoamericano"],r:null,campo:"fijo"},
    {id:"n2",q:"¿Cómo es su cara, en tres o cuatro palabras?",o:["Cuadrada, mandíbula ancha, cejas pobladas","Alargada, nariz recta, labios finos","Redonda, mejillas llenas"],r:null,campo:"fijo"},
    {id:"n3",q:"¿Su pelo?",o:["Corto, negro y rizado","Rubio liso por los hombros","Canoso, rapado a los lados"],r:null,campo:"fijo"},
    {id:"n4",q:"¿Alguna seña, con su lado?",o:["Cicatriz pequeña en la ceja IZQUIERDA","Lunar en la mejilla DERECHA","Ninguna"],r:null,campo:"fijo"},
    {id:"n5",q:"¿Vestuario base?",o:["Camisa vaquera y pantalón chino","Sudadera gris lisa","Traje azul marino sin corbata"],r:null,campo:"var"}
  ];
}

function nuevoEstado(){
  return {
    tab:"director", paso:0, origen:null, nombre:"", real:false,
    rasgos:[], resumenManual:null, preguntas:[], uso:null, vistas:[], expr:["Sonrisa amplia"], vistaDir:null,
    hoja:{fondo:OPC.fondo[0], luz:OPC.luz[0], acabado:OPC.acabado[0]}, hojaGuardada:false,
    preparado:false, revision:1, tomas:[], lotes:[], sel:null,
    armar:{drift:false, fallo:false, incierta:false, corte:false},
    gastoEst:0, gastoRes:0, ops:0,
    ficha:{vigente:2, borrador:null, refs:[], direccionHoja:null}, modal:null, accionBarra:null, nTomas:0
  };
}
let S = nuevoEstado();
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(S)); }catch(e){} }

function anclaLista(){ return S.origen==="refs" || S.ficha.refs.some(r=>r.ancla); }
function refsAprobadas(){
  const l = [];
  if (S.origen==="refs") l.push("Ancla (frontal, ficha v2)");
  S.ficha.refs.forEach(r=>l.push((r.ancla?"Ancla":"T"+r.n)+" ("+r.vista+(r.expresion?" · "+r.expresion:"")+", v"+r.v+")"));
  return l;
}
function resumen(){
  if (S.resumenManual!==null) return S.resumenManual;
  const fijos = S.rasgos.filter(r=>r.c==="fijo").map(r=>r.t);
  if (!fijos.length) return "";
  let t = (S.nombre||"El personaje") + ". " + fijos.join(". ") + ".";
  if (!S.rasgos.some(r=>/lunar|cicatriz|pecas/i.test(r.t))) t += " Piel limpia, sin tatuajes.";
  return t + " Piel real, con poros y pequeñas imperfecciones; sin retocar.";
}

function vistasPara(uso){
  const u = USOS.find(x=>x.id===uso);
  const lista = [];
  if (!anclaLista()) lista.push({clave:"ancla",marcada:true,fija:true});
  ["tres_cuartos","perfil","cuerpo_entero","expresion"].forEach(k=>lista.push({clave:k, marcada:u?u.v.includes(k):false}));
  return lista.map(v=>({...v, enc:VISTAS[v.clave].enc, ang:VISTAS[v.clave].ang, obj:VISTAS[v.clave].obj, exc:false, luz:S.hoja.luz, fondo:S.hoja.fondo}));
}
function unidades(){
  const out=[];
  S.vistas.filter(v=>v.marcada && (v.clave==="ancla"||anclaLista())).forEach(v=>{
    if (v.clave==="expresion") S.expr.forEach(e=>out.push({v, expresion:e.toLowerCase()}));
    else out.push({v, expresion:null});
  });
  return out;
}
const claveU = u => u.v.clave+":"+(u.expresion||"-");
function nombreU(u){ return u.expresion ? "Vista frontal · expresión: "+u.expresion : VISTAS[u.v.clave].nombre+(u.v.clave==="ancla"?"":" · expresión: neutra"); }
function estadoU(u){
  const ts = S.tomas.filter(t=>t.clave===claveU(u) && !t.reemplazada);
  if (ts.some(t=>t.enFicha)) return "aprobada";
  if (ts.some(t=>["generando","incierta","preparada"].includes(t.estado))) return "en_curso";
  if (ts.some(t=>t.estado==="lista" && !t.desc)) return "por_revisar";
  return "pendiente";
}

function refsDe(u){
  if (u.v.clave==="ancla") return [];
  const r=[{n:1, que:"Ancla de "+(S.nombre||"el personaje"), para:"identidad: conserva su cara, pelo, tono de piel y complexión; no copies la pose, la ropa, el encuadre ni el fondo"}];
  if (u.expresion && S.ficha.refs.some(x=>x.vista==="cuerpo entero"))
    r.push({n:2, que:"Cuerpo entero aprobado", para:"vestuario: conserva la ropa; no copies la pose ni la cara"});
  return r;
}
function luzDe(v){ return v.exc ? v.luz : S.hoja.luz; }
function fondoDe(v){ return v.exc ? v.fondo : S.hoja.fondo; }
function texto(u){
  const v = u.v, n = S.nombre || "El personaje";
  const desc = v.clave==="ancla" ? "Retrato fotográfico de una sola persona, expresión neutra, mirando a cámara."
    : "Una sola persona. Vista: "+VISTAS[v.clave].vista+". Expresión: "+(u.expresion||"neutra")+".";
  const l = [desc,
    S.real ? n+" es una persona real; su cara sale de la imagen 1, no de este texto." : "Rasgos que se deben conservar: "+resumen(),
    "Encuadre: "+v.enc+". Ángulo: "+v.ang+". Objetivo: "+v.obj+". Luz: "+luzDe(v)+". Fondo: "+fondoDe(v)+". Acabado: "+S.hoja.acabado+".",
    "Sin: piel de plástico, cara retocada, rasgos simétricos perfectos.", "Sin texto ni rótulos en la imagen."];
  refsDe(u).forEach(r=>l.push("Imagen "+r.n+": "+r.para+"."));
  if (S.real) l.push(n+" es una persona real: mantén su identidad facial exacta, con sus rasgos, edad y proporciones, tal como aparece en la imagen 1.");
  return l.join("\n");
}

function retrato(clave, variante, drift, expr){
  const piel = drift ? "#B98C70" : "#C9A184", pelo = drift ? "#7A5A3A" : "#3B2A22";
  const son = expr && /sonrisa|risa/.test(expr), sor = expr && /sorpresa/.test(expr);
  const boca = sor ? '<ellipse cx="0" cy="22" rx="5" ry="7" fill="#7a3d33"/>' : son ? '<path d="M-11 18 Q0 30 11 18" stroke="#7a3d33" stroke-width="3" fill="none"/>' : '<path d="M-9 21 L9 21" stroke="#7a3d33" stroke-width="3"/>';
  let cab, cue;
  if (clave==="perfil"){
    cab = '<g transform="translate(150 150)"><path d="M-40 -60 Q20 -95 48 -40 Q60 0 40 50 L-30 55 Z" fill="'+pelo+'"/><path d="M-20 -55 Q45 -65 50 0 Q58 10 52 18 Q48 40 30 55 L-25 60 Q-35 0 -20 -55Z" fill="'+piel+'"/><circle cx="28" cy="-8" r="3.5" fill="#2c3b2a"/></g>';
  } else {
    const g = clave==="tres_cuartos" ? 12 : 0, ce = clave==="cuerpo_entero";
    cab = '<g transform="translate('+(150+g)+' '+(ce?72:150)+') scale('+(ce?0.38:1)+')"><ellipse cx="0" cy="-8" rx="62" ry="78" fill="'+pelo+'"/><ellipse cx="'+g/2+'" cy="4" rx="46" ry="60" fill="'+piel+'"/><circle cx="'+(-16+g)+'" cy="-6" r="4" fill="#2c3b2a"/><circle cx="'+(16+g)+'" cy="-6" r="4" fill="#2c3b2a"/>'+(drift?'':'<circle cx="'+(26+g)+'" cy="-22" r="2" fill="#5a3a2a"/>')+'<g transform="translate('+g+' 0)">'+boca+'</g></g>';
  }
  cue = clave==="cuerpo_entero" ? '<rect x="126" y="100" width="48" height="130" rx="16" fill="#7d8790"/><rect x="130" y="224" width="17" height="150" rx="8" fill="#3d4652"/><rect x="153" y="224" width="17" height="150" rx="8" fill="#3d4652"/>' : '<path d="M60 400 Q70 250 150 240 Q230 250 240 400Z" fill="#7d8790"/>';
  return '<svg viewBox="0 0 300 400" role="img" aria-label="Imagen simulada"><rect width="300" height="400" fill="#A7A39E"/>'+cue+cab+'<text x="12" y="390" font-size="13" fill="#3a3a3a" font-family="Mulish,sans-serif">simulada · '+esc(variante)+'</text></svg>';
}

function render(){
  $("#app").innerHTML = cabecera() + proto() + '<div class="cuerpo">' + mesa() + lateral() + '</div>' + barra() + modal();
  guardar();
}
function cabecera(){
  const fb = S.nombre ? '<button class="btn chico" data-a="verFicha">Ficha de '+esc(S.nombre)+' · v'+S.ficha.vigente+(S.ficha.borrador?' (borrador v'+S.ficha.borrador+')':'')+'</button>' : '';
  return '<header class="top"><b>Picasso Studio</b><span class="ruta">JRGB / Taller</span><div class="carpetas"><span class="pest">General</span><span class="pest">Marca JRGB</span>'+(S.nombre?'<span class="pest on">Personaje · '+esc(S.nombre)+'</span>':'')+'</div><span class="gasto">Gasto: <b>'+euro(S.gastoEst)+'</b> estimado · <b>'+euro(S.gastoRes)+'</b> reservado</span>'+fb+'</header>';
}
function proto(){
  const b = (k,t)=>'<button class="btn'+(S.armar[k]?' armado':'')+'" data-a="armar" data-v="'+k+'">'+t+(S.armar[k]?' ✓':'')+'</button>';
  return '<div class="proto"><b>Prototipo</b><span>Nada se genera ni se cobra. En el próximo lote:</span>'+b("drift","una pierde la identidad")+b("fallo","una falla")+b("incierta","una queda sin confirmar")+b("corte","se recarga entre fases")+'<button class="btn" data-a="cerrarVolver">cerrar y volver a abrir</button><button class="btn" data-a="cero" style="margin-left:auto">empezar de cero</button></div>';
}

function chipToma(t){
  if (t.estado==="generando") return '<span class="chip gen">Generando… '+euro(PRECIO)+' reservado</span>';
  if (t.estado==="preparada") return '<span class="chip">Preparada, sin autorizar · sin coste</span>';
  if (t.estado==="incierta") return '<span class="chip gen">Sin confirmar · posible cargo '+euro(PRECIO)+'</span>';
  if (t.estado==="fallida") return '<span class="chip err">Falló · reserva liberada</span>';
  if (t.enFicha) return '<span class="chip ficha">En la ficha · v'+t.enFicha+'</span>';
  if (t.desc) return '<span class="chip err">'+(t.motivo==="identidad"?'No mantiene la identidad':'Descartada')+'</span>';
  return '<span class="chip">Por revisar</span>';
}
function mesa(){
  let h = '<main class="mesa" aria-label="Mesa">';
  if (!S.nombre) return h + '<h2>Mesa</h2><div class="vacio">La Mesa está vacía. Abre el <b>Director de Studio</b> en el lateral y elige «Hoja de personaje» para preparar las vistas de un personaje sin escribir prompts.</div></main>';
  const pend = S.tomas.filter(t=>t.estado==="lista"&&!t.enFicha&&!t.desc).length;
  h += '<div><h2>Personaje · '+esc(S.nombre)+'</h2><p class="sub">'+S.tomas.length+' tomas · '+pend+' por revisar · ancla '+(anclaLista()?'aprobada':'pendiente')+'</p></div>';
  if (!S.tomas.length) h += '<div class="vacio">Todavía no hay tomas. Lo preparado en el Director aparece aquí al generar.</div>';
  h += '<div class="rejilla">';
  if (S.origen==="refs") h += '<div class="toma"><div class="marco">'+retrato("ancla","ancla v2",false)+'</div><div class="cab"><b>Ancla</b></div><span class="chip">Vista: frontal · Expresión: neutra</span><span class="chip ficha">En la ficha · v2</span></div>';
  S.tomas.forEach(t=>{
    const lista = t.estado==="lista";
    h += '<button class="toma'+(S.sel===t.id?' sel':'')+(t.desc||t.estado==="fallida"?' desc':'')+(t.estado==="generando"?' generando':'')+'" data-a="sel" data-id="'+t.id+'"><div class="marco">'+(lista?retrato(t.vclave,"T"+t.n,t.drift,t.expresion):'')+'</div><div class="cab"><b>T'+t.n+'</b>'+(t.fav?'<span class="estrella" aria-label="favorita">★</span>':'')+'</div><span class="chip">Vista: '+esc(t.vista)+' · Expresión: '+esc(t.expresion||"neutra")+'</span>'+chipToma(t)+'</button>';
  });
  return h + '</div></main>';
}

function lateral(){
  const t = S.tomas.find(x=>x.id===S.sel);
  let h = '<aside class="lat"><div class="tabs" role="tablist"><button class="tab'+(S.tab==="imagen"?' on':'')+'" role="tab" data-a="tab" data-v="imagen"'+(t?'':' disabled')+'>'+(t?'Imagen · T'+t.n:'Imagen')+'</button><button class="tab'+(S.tab==="director"?' on':'')+'" role="tab" data-a="tab" data-v="director">Director de Studio</button></div><div class="latc">';
  h += S.tab==="imagen" && t ? panelImagen(t) : panelDirector();
  return h + '</div></aside>';
}
function maxPaso(){ return !S.origen ? (S.paso===0?1:0) : !S.uso ? 4 : 6; }
function panelDirector(){
  let h = '<div class="contexto"><span class="chip">Receta guiada · sin agente</span> Trabajando sobre: <b>'+(S.nombre?'Personaje: '+esc(S.nombre)+' · ficha v'+S.ficha.vigente+(S.ficha.borrador?' + borrador v'+S.ficha.borrador:''):'Nueva receta')+'</b></div>';
  if (S.paso>0) h += '<div class="pasos">'+PASOS.map((p,i)=>'<button class="paso'+(i===S.paso?' on':i<S.paso?' hecho':'')+'" data-a="ir" data-p="'+i+'"'+(i>maxPaso()?' disabled':'')+'>'+(i+1)+' · '+p+'</button>').join("")+'</div>';

function pReceta(){
  return '<h3>¿Qué quieres preparar?</h3><p class="ayuda">Estas recetas te guían por pasos con opciones cerradas y reglas fijas. Preparan texto, referencias y dirección para que los revises. No generan ni gastan: eso lo hace el botón de la barra, con su precio.</p>'+
  '<button class="opcion" data-a="receta"><div><b>Hoja de personaje</b><small>Receta guiada: desde una referencia o una descripción hasta las vistas y expresiones que necesites.</small></div></button>'+
  '<button class="opcion" disabled><div><b>Hablar con el Director</b><small>Próximamente. El agente que entiende lo que cuentas con tus palabras y te orienta. Cada consulta tendrá su precio y su autorización.</small></div></button>'+
  '<button class="opcion" disabled><div><b>Fotografía de producto · Dirección visual del proyecto</b><small>Más recetas, más adelante (18.66).</small></div></button>';
}
function pOrigen(){
  return '<h3>¿De dónde partimos?</h3>'+
  '<button class="opcion'+(S.origen==="refs"?' on':'')+'" data-a="origen" data-v="refs"><div><b>De referencias existentes</b><small>Marta · ficha v2 aprobada, con retrato frontal marcado como ancla.</small></div></button>'+
  '<button class="opcion'+(S.origen==="desc"?' on':'')+'" data-a="origen" data-v="desc"><div><b>Describir un personaje nuevo</b><small>Sin foto. La primera vista es el retrato ancla, que apruebas antes de las demás.</small></div></button>'+
  '<label class="fila" style="font-size:12.5px;color:var(--tinta2)"><input type="checkbox" id="real" data-a="real"'+(S.real?' checked':'')+(S.origen==="refs"?'':' disabled')+'> Es una persona real: la cara sale de su foto y no se genera</label>';
}
function pIdentidad(){
  const fila = (r,f)=>'<div class="rasgo"><span>'+esc(r.t)+'</span><button data-a="mover" data-id="'+r.id+'" aria-label="mover">'+f+'</button></div>';
  const fijos=S.rasgos.filter(r=>r.c==="fijo"), vars=S.rasgos.filter(r=>r.c==="var"), refs=refsAprobadas();
  return '<h3>Identidad, apariencia y vestuario</h3><p class="ayuda">Lo de la izquierda se pide en cada imagen. Lo de la derecha puede cambiar según la toma.</p>'+
  '<div class="cols"><div class="col"><h4>Se conserva</h4>'+(fijos.map(r=>fila(r,"→")).join("")||'<p class="ayuda">Nada todavía.</p>')+'</div><div class="col"><h4>Puede variar</h4>'+(vars.map(r=>fila(r,"←")).join("")||'<p class="ayuda">Nada todavía.</p>')+'</div></div>'+
  '<div class="bloque"><div class="fila"><b style="font-size:13px">Rasgos y referencias que se deben conservar</b><span class="director">'+(S.resumenManual!==null?'Editado por ti':'Preparado por el Director')+'</span></div><textarea id="resumen" data-a="resumen" aria-label="Rasgos que se deben conservar">'+esc(resumen())+'</textarea>'+
  '<div class="imgs"><span><b style="color:var(--tinta)">Referencias que viajan:</b> '+(refs.length?esc(refs.join(" · ")):'ninguna todavía; la primera será el retrato ancla')+'</span></div>'+
  '<div class="aviso">Esto se pide en cada imagen, pero no garantiza nada: si se ha conservado se comprueba al comparar cada resultado con el ancla.</div></div>'+
  '<button class="btn amb" data-a="ir" data-p="3">Seguir</button>';
}
function pFalta(){
  const pend = S.preguntas.filter(q=>q.r===null).slice(0,2);

  if (!pend.length) h += '<div class="aviso ok">No falta nada para preparar las vistas.</div>';
  pend.forEach(q=>{ h += '<div class="bloque"><b style="font-size:13px">'+esc(q.q)+'</b><div class="fila">'+q.o.map((o,i)=>'<button class="btn chico" data-a="resp" data-id="'+q.id+'" data-i="'+i+'">'+esc(o)+'</button>').join("")+'<button class="btn txt chico" data-a="resp" data-id="'+q.id+'" data-i="-1">Omitir</button></div></div>'; });
  const om = S.preguntas.filter(q=>q.r==="omit");
  if (om.length) h += '<p class="ayuda">Sin decidir: '+om.map(q=>esc(q.q)).join(" · ")+'</p>';
  return h + '<button class="btn amb" data-a="ir" data-p="4">Seguir</button>';
}
function pUso(){
  let h = '<h3>¿Para qué lo vas a usar?</h3><p class="ayuda">Según el uso propongo vistas. Marca solo las que necesites. Cada imagen es una vista; las expresiones se piden aparte.</p>';

  if (!S.uso) return h;
  h += '<div class="bloque"><b style="font-size:13px">Vistas (una por imagen)</b>';
  S.vistas.forEach((v,i)=>{
    const bloq = v.clave!=="ancla" && !anclaLista();
    h += '<label class="fila" style="font-size:13px"><input type="checkbox" data-a="marcar" data-i="'+i+'"'+(v.marcada?' checked':'')+(v.fija||bloq?' disabled':'')+'> '+VISTAS[v.clave].nombre+(v.fija?' <span class="chip">obligatoria: aún no hay ancla</span>':'')+(bloq?' <span class="chip">cuando apruebes el ancla</span>':'')+'</label>';
  });

}
function sel(id,k,val,lista){ return '<select id="'+id+'" data-a="'+k+'">'+lista.map(o=>'<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join("")+'</select>'+(PORQUE[val]?'<span class="porque">'+esc(PORQUE[val])+'</span>':''); }
function pDir(){

function porGenerar(){ return unidades().filter(u=>estadoU(u)==="pendiente"); }

      (dos?'<div class="aviso err">Dos descartes por identidad en esta vista: prueba con otra referencia o con otra vista; este modelo no la está manteniendo.</div>':'')+'</div>';
  }
  h += '<div><b style="font-size:13px">Cómo se hizo</b><pre style="white-space:pre-wrap;font-family:inherit;font-size:12px;background:var(--fondo);border-radius:6px;padding:8px;margin:6px 0 0;max-height:140px;overflow:auto">'+esc(t.texto)+'</pre><p class="ayuda" style="margin-top:6px">'+MODELO+' · '+euro(PRECIO)+' estimado, sin importe del proveedor · lote '+esc(t.lote)+' · id_peticion '+esc(t.idp)+'</p></div>';
  return h + '<div><b style="font-size:13px">Historial</b><ul class="hist">'+t.hist.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>';
}

function barra(){
  let alc='Nueva imagen', msg='Escribe en la barra o prepara con el Director.', btn='<button class="btn amb" disabled>Generar</button>';
  const gen = S.tomas.some(t=>t.estado==="generando");
  const prep = S.tomas.filter(t=>t.estado==="preparada");
  const fall = S.tomas.filter(t=>t.estado==="fallida" && !t.reemplazada);
  const us = S.preparado ? porGenerar() : [];
  if (S.accionBarra){
    alc=S.accionBarra.alcance; msg=S.accionBarra.msg;
    btn='<button class="btn" data-a="cancelarBarra">Cancelar</button><button class="btn amb" data-a="ejecutarBarra"'+(gen?' disabled':'')+'>'+esc(S.accionBarra.boton)+'</button>';
  } else if (prep.length){
    alc='Lote '+esc(prep[0].lote); msg=prep.length+' vistas preparadas sin autorizar tras la recarga. No han reservado nada. Pulsar autoriza este importe.';
    btn='<button class="btn amb" data-a="autorizarPreparadas">Autorizar '+prep.length+' · '+euro(prep.length*PRECIO)+'</button>';
  } else if (fall.length && !gen){
    alc='Hoja de personaje · '+esc(S.nombre); msg=fall.length+' vista'+(fall.length>1?'s':'')+' falló y su reserva se liberó. Generar las que faltan es un lote nuevo, con su precio.';
    btn='<button class="btn amb" data-a="faltan">Generar las que faltan · '+euro(fall.length*PRECIO)+'</button>';
  } else if (us.length){
    alc='Hoja de personaje · '+esc(S.nombre); msg='Preparado por el Director: '+us.map(nombreU).join(", ")+'. Pulsar el botón es la autorización.';
    btn='<button class="btn amb" data-a="generar"'+(gen?' disabled':'')+'>'+(gen?'Generando…':'Generar '+us.length+(us.length===1?' vista':' vistas')+' · '+euro(us.length*PRECIO))+'</button>';
  }
  return '<div class="barra"><span class="alcance">'+alc+'</span><span class="msg">'+msg+'</span>'+btn+'</div>';
}

function modal(){
  if (!S.modal) return "";
  if (S.modal.tipo==="comparar"){
    const t = S.tomas.find(x=>x.id===S.modal.id);
    return '<div class="velo" data-a="cerrarModal"><div class="modal" role="dialog" aria-label="Comparar con el ancla" data-stop="1"><div class="fila"><h3>Comparar T'+t.n+' con el ancla</h3><button class="btn chico" style="margin-left:auto" data-a="cerrarModal">Cerrar</button></div><div class="par"><div><div class="marco">'+retrato("ancla","ancla",false)+'</div><p class="ayuda">Ancla · frontal · neutra</p></div><div><div class="marco">'+retrato(t.vclave,"T"+t.n,t.drift,t.expresion)+'</div><p class="ayuda">T'+t.n+' · '+esc(t.vista)+' · '+esc(t.expresion||"neutra")+'</p></div></div><b style="font-size:13px">Revisa en este orden</b><ol class="lista"><li>Forma de la cara</li><li>Ojos y su color</li><li>Cejas</li><li>Nariz y boca</li><li>Pelo</li><li>Señas en su lado</li><li>Edad aparente</li></ol>'+(t.enFicha||t.desc?'':'<div class="fila"><button class="btn amb" data-a="aprobar">Aprobar para la ficha</button><button class="btn" data-a="noid">No mantiene la identidad</button></div>')+'</div></div>';
  }
  const refs = S.ficha.refs, dh = S.ficha.direccionHoja || (S.hojaGuardada ? S.hoja : null);
  let h = '<div class="velo" data-a="cerrarModal"><div class="modal" role="dialog" aria-label="Ficha del personaje" data-stop="1"><div class="fila"><h3>Ficha de '+esc(S.nombre)+'</h3><button class="btn chico" style="margin-left:auto" data-a="cerrarModal">Cerrar</button></div>';
  h += '<p class="ayuda">Vigente: v'+S.ficha.vigente+' (aprobada, no se toca). '+(S.ficha.borrador?'Borrador: v'+S.ficha.borrador+'. Lo aprobado en la Mesa entra aquí.':'Sin borrador.')+'</p>';
  h += '<div class="bloque"><b style="font-size:13px">Referencias</b>'+(S.origen==="refs"?'<span style="font-size:12.5px">v2 · vista frontal · expresión neutra · ancla</span>':'')+refs.map(r=>'<span style="font-size:12.5px">v'+r.v+' · vista '+esc(r.vista)+' · expresión '+esc(r.expresion||"neutra")+(r.ancla?' · ancla':'')+' · de T'+r.n+(r.v===S.ficha.borrador?' (borrador)':'')+'</span>').join("")+(!refs.length&&S.origen!=="refs"?'<span class="ayuda">Ninguna todavía.</span>':'')+'</div>';
  h += '<div class="bloque"><b style="font-size:13px">Rasgos y referencias que se deben conservar</b><span style="font-size:12.5px">'+esc(resumen()||"Sin decidir.")+'</span></div>';
  h += '<div class="bloque"><b style="font-size:13px">Dirección de la hoja</b>'+(dh?'<span style="font-size:12.5px">Fondo: '+esc(dh.fondo)+' · Luz: '+esc(dh.luz)+' · Acabado: '+esc(dh.acabado)+(S.ficha.direccionHoja?' · guardada en v'+S.ficha.vigente:' · se guardará al aprobar el borrador')+'</span>':'<span class="ayuda">Sin guardar todavía.</span>')+'</div>';
  if (S.ficha.borrador) h += '<button class="btn amb" data-a="aprobarFicha"'+(refs.some(r=>r.v===S.ficha.borrador)?'':' disabled')+'>Aprobar ficha v'+S.ficha.borrador+'</button><p class="ayuda">Aprobada, la versión queda inmutable. Para cambiarla después se crea otra.</p>';
  return h + '</div></div>';
}

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),3400); }

function crearLote(us, extra){
  const total = us.length*PRECIO;
  if (S.gastoEst + S.gastoRes + total > PRESUPUESTO) toast("Supera el presupuesto de ejemplo: en Picasso pediría confirmación para este total.");
  S.revision++;
  const lote = "L"+(S.lotes.length+1);
  const ids = [];
  const n = us.length;
  us.forEach((u,i)=>{
    S.nTomas++;
    const id="t"+S.nTomas, idp="sesion:pic05:"+u.v.clave+":"+(u.expresion||"neutra").replace(/\s/g,"_")+":"+S.revision;
    const t={id, n:S.nTomas, clave:claveU(u), vclave:u.v.clave, vista:VISTAS[u.v.clave].vista, expresion:u.expresion, estado:"generando", fav:false, desc:false, motivo:null, enFicha:null, drift:false, reemplazada:false, lote, idp, texto:extra&&extra.texto?extra.texto:texto(u), hist:["Lote "+lote+": "+euro(PRECIO)+" reservado al autorizar · "+idp+(extra&&extra.nota?" · "+extra.nota:"")]};
    if (S.armar.drift && i===0){ t.drift=true; }
    if (S.armar.fallo && i===n-1) t.fin="fallida";
    else if (S.armar.incierta && i===n-1) t.fin="incierta";
    if (S.armar.corte && i>0){ t.estado="preparada"; t.hist=["Lote "+lote+": preparada; sin autorizar cuando se recargó · "+idp]; }
    else { S.gastoRes+=PRECIO; S.ops++; }
    S.tomas.push(t); ids.push(id);
  });
  S.lotes.push({id:lote, total, tomas:ids, tarifa:TARIFA});
  const corte = S.armar.corte;
  S.armar={drift:false, fallo:false, incierta:false, corte:false};
  S.gastoRes=redondo(S.gastoRes);
  if (corte){ setTimeout(()=>{ acciones.cerrarVolver(); }, 50); }
  else setTimeout(terminar, 1100);
}
function terminar(){
  let c=false;
  S.tomas.forEach(t=>{
    if (t.estado!=="generando") return;
    c=true;
    if (t.fin==="fallida"){ t.estado="fallida"; S.gastoRes-=PRECIO; t.hist.push("Rechazada por el proveedor: reserva liberada"); }
    else if (t.fin==="incierta"){ t.estado="incierta"; t.hist.push("Sin respuesta del proveedor: reserva mantenida como posible cargo"); }
    else { t.estado="lista"; S.gastoRes-=PRECIO; S.gastoEst+=PRECIO; t.hist.push("Completada: "+euro(PRECIO)+" estimado, sin importe del proveedor"); }
    delete t.fin;
  });
  S.gastoRes=redondo(S.gastoRes); S.gastoEst=redondo(S.gastoEst);
  if (c) render();
}

const acciones = {
  receta(){ S.paso=1; },
  origen(el){
    S.origen=el.dataset.v; S.uso=null; S.vistas=[]; S.preparado=false; S.resumenManual=null;
    if (S.origen==="refs"){ S.nombre="Marta"; S.rasgos=rasgosMarta(); S.preguntas=preguntasMarta(); S.ficha={vigente:2,borrador:null,refs:[],direccionHoja:null}; }
    else { S.nombre="Personaje nuevo"; S.real=false; S.rasgos=[]; S.preguntas=preguntasNuevo(); S.ficha={vigente:1,borrador:null,refs:[],direccionHoja:null}; }
    S.paso=2;
  },
  real(el){ S.real=el.checked; },
  mover(el){ const r=S.rasgos.find(x=>x.id===el.dataset.id); r.c=r.c==="fijo"?"var":"fijo"; S.resumenManual=null; cambio(); },
  resp(el){ const q=S.preguntas.find(x=>x.id===el.dataset.id), i=+el.dataset.i; if (i<0) q.r="omit"; else { q.r=q.o[i]; if (!/^Ninguna|^Nada fijo/.test(q.r)) S.rasgos.push({id:"a"+q.id,t:q.r,c:q.campo}); S.resumenManual=null; cambio(); } },
  uso(el){ S.uso=el.dataset.v; S.vistas=vistasPara(S.uso); S.preparado=false; },
  marcar(el){ S.vistas[+el.dataset.i].marcada=el.checked; S.preparado=false; },
  expr(el){ const e=el.dataset.v; if (S.expr.includes(e)){ if (S.expr.length>1) S.expr=S.expr.filter(x=>x!==e); } else if (S.expr.length<3) S.expr.push(e); else toast("Como mucho 3 expresiones por ronda."); S.preparado=false; },
  vdir(el){ S.vistaDir=el.dataset.v; },
  "hoja-fondo"(el){ S.hoja.fondo=el.value; S.hojaGuardada=true; S.preparado=false; },
  "hoja-luz"(el){ S.hoja.luz=el.value; S.hojaGuardada=true; S.preparado=false; },
  "hoja-acabado"(el){ S.hoja.acabado=el.value; S.hojaGuardada=true; S.preparado=false; },
  "v-enc"(el){ vd().enc=el.value; S.preparado=false; },
  "v-ang"(el){ vd().ang=el.value; S.preparado=false; },
  "v-obj"(el){ vd().obj=el.value; S.preparado=false; },
  "v-exc"(el){ const v=vd(); v.exc=el.checked; v.luz=S.hoja.luz; v.fondo=S.hoja.fondo; S.preparado=false; },
  "v-luz"(el){ vd().luz=el.value; S.preparado=false; },
  "v-fondo"(el){ vd().fondo=el.value; S.preparado=false; },
  intimo(){ const v=vd(); v.enc="Plano medio corto, cabeza y hombros"; v.obj="85 mm"; S.preparado=false; toast("«Más íntimo»: plano más cerrado y 85 mm. Revísalo."); },
  restablecer(){ const v=vd(), b=VISTAS[v.clave]; v.enc=b.enc; v.ang=b.ang; v.obj=b.obj; v.exc=false; S.preparado=false; },
  ir(el){ S.paso=+el.dataset.p; if (S.paso===5) S.hojaGuardada=true; },
  preparar(){ S.preparado=true; S.hojaGuardada=true; toast("Preparado y guardado, con la dirección de la hoja. No se ha generado nada ni se ha gastado."); },
  generar(){ if (S.tomas.some(t=>t.estado==="generando")) return; crearLote(porGenerar()); S.preparado=false; },
  autorizarPreparadas(){
    S.tomas.filter(t=>t.estado==="preparada").forEach(t=>{ t.estado="generando"; S.gastoRes+=PRECIO; S.ops++; t.hist.push("Autorizada después de la recarga: "+euro(PRECIO)+" reservado"); });
    S.gastoRes=redondo(S.gastoRes); setTimeout(terminar,1100);
  },
  faltan(){
    const f = S.tomas.filter(t=>t.estado==="fallida" && !t.reemplazada);
    const us = f.map(t=>{ t.reemplazada=true; return {v:S.vistas.find(x=>x.clave===t.vclave), expresion:t.expresion}; });
    crearLote(us);
  },
  comprobar(){ const t=cur(); t.estado="lista"; S.gastoRes=redondo(S.gastoRes-PRECIO); S.gastoEst=redondo(S.gastoEst+PRECIO); t.hist.push("Comprobada: el proveedor la tenía hecha; pasa a estimado"); },
  sel(el){ S.sel=el.dataset.id; S.tab="imagen"; },
  tab(el){ S.tab=el.dataset.v; },
  fav(){ const t=cur(); t.fav=!t.fav; t.hist.push(t.fav?"★ favorita":"★ quitada"); },
  descartar(){ const t=cur(); t.desc=true; t.hist.push("Descartada"); },
  recuperar(){ const t=cur(); t.desc=false; t.motivo=null; t.hist.push("Recuperada"); },
  comparar(){ S.modal={tipo:"comparar", id:S.sel}; },
  aprobar(){
    const t=cur(); if (!S.ficha.borrador) S.ficha.borrador=S.ficha.vigente+1;
    const ancla = t.vclave==="ancla";
    t.enFicha=S.ficha.borrador; t.hist.push("Aprobada para la ficha v"+S.ficha.borrador+" · vista "+t.vista+" · expresión "+(t.expresion||"neutra")+(ancla?" · ancla":"")+" (no marca ★)");
    S.ficha.refs.push({v:S.ficha.borrador, vista:t.vista, expresion:t.expresion, ancla, n:t.n});
    S.modal=null;
    if (ancla && S.uso){ const u=USOS.find(z=>z.id===S.uso); S.vistas.forEach(x=>{ if (x.clave!=="ancla") x.marcada=u.v.includes(x.clave); }); toast("Ancla aprobada en el borrador. Ya puedes preparar las demás vistas."); }
    else toast("Añadida al borrador v"+S.ficha.borrador+". La ficha vigente no cambia hasta que apruebes la versión.");
  },
  noid(){ const t=cur(); t.desc=true; t.motivo="identidad"; t.hist.push("Descartada: no mantiene la identidad. El medio se conserva."); S.modal=null; S.tab="imagen"; },
  corregir(){ const t=cur(); S.accionBarra={alcance:"Editar T"+t.n, msg:"Preparado por el Director: corregir T"+t.n+" con el ancla como imagen 2, «cambia solo la cara». El modelo puede alterar otros detalles.", boton:"Aplicar cambio · "+euro(PRECIO), tipo:"corregir", id:t.id}; },
  revdir(){ const t=cur(); S.tab="director"; S.paso=5; S.vistaDir=t.vclave; },
  regenerar(){ const t=cur(); S.accionBarra={alcance:"Hoja de personaje · "+S.nombre, msg:"Preparado: volver a generar T"+t.n+" (vista "+t.vista+", expresión "+(t.expresion||"neutra")+") con la misma dirección.", boton:"Generar 1 vista · "+euro(PRECIO), tipo:"regenerar", id:t.id}; },
  cancelarBarra(){ S.accionBarra=null; },
  ejecutarBarra(){
    const a=S.accionBarra, t=S.tomas.find(x=>x.id===a.id), v=S.vistas.find(x=>x.clave===t.vclave)||{clave:t.vclave,...VISTAS[t.vclave],exc:false};
    const u={v, expresion:t.expresion};
    if (a.tipo==="corregir") crearLote([u],{nota:"edición de T"+t.n+" con el ancla", texto:"Cambia solo la cara para que sea la de la imagen 2. Mantén todo lo demás como está.\nImagen 1: T"+t.n+" (imagen a editar).\nImagen 2: identidad de "+S.nombre+": conserva su cara, pelo, tono de piel y complexión."});
    else crearLote([u]);
    S.accionBarra=null;
  },
  cerrarModal(){ S.modal=null; },
  verFicha(){ S.modal={tipo:"ficha"}; },
  aprobarFicha(){ S.ficha.vigente=S.ficha.borrador; S.ficha.borrador=null; S.ficha.direccionHoja={...S.hoja}; S.modal=null; toast("Ficha v"+S.ficha.vigente+" aprobada, con su dirección de la hoja. Los cambios irán a una versión nueva."); },
  armar(el){ const k=el.dataset.v; S.armar[k]=!S.armar[k]; },
  cero(){ S=nuevoEstado(); try{ localStorage.removeItem(CLAVE); }catch(e){} },
  cerrarVolver(){
    const copia=JSON.stringify(S);
    const v=document.createElement("div"); v.className="cerrado"; v.textContent="Taller cerrado. Volviendo a abrir…"; document.body.appendChild(v);
    setTimeout(()=>{
      S=JSON.parse(copia); S.modal=null; v.remove(); render();
      const en=S.tomas.filter(t=>t.estado==="generando").length, pr=S.tomas.filter(t=>t.estado==="preparada").length, inc=S.tomas.filter(t=>t.estado==="incierta").length, rev=S.tomas.filter(t=>t.estado==="lista"&&!t.enFicha&&!t.desc).length;
      toast("Recuperado: paso «"+PASOS[S.paso]+"», dirección de la hoja guardada, "+rev+" por revisar"+(en?", "+en+" en curso (se reconcilian por id_peticion)":"")+(pr?", "+pr+" preparadas sin autorizar (no se autorizan solas)":"")+(inc?", "+inc+" sin confirmar":"")+".");
      if (en) setTimeout(terminar,900);
    },700);
    return "noRender";
  }
};
function cur(){ return S.tomas.find(x=>x.id===S.sel); }
function vd(){ return S.vistas.find(x=>x.clave===S.vistaDir); }
function cambio(){ if (S.preparado){ S.preparado=false; toast("Has cambiado un rasgo: las vistas preparadas se rehacen. Las aprobadas quedan marcadas como hechas antes del cambio."); } }

const DE_CAMBIO = ["marcar","real","hoja-fondo","hoja-luz","hoja-acabado","v-enc","v-ang","v-obj","v-exc","v-luz","v-fondo"];
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if (!el) return;
  if (el.classList.contains("velo") && e.target.closest("[data-stop]")) return;
  const a=el.dataset.a;
  if (DE_CAMBIO.includes(a) || a==="resumen" || el.disabled) return;
  const r=acciones[a] && acciones[a](el);
  if (r!=="noRender") render();
});
document.addEventListener("change", e=>{ const el=e.target, a=el.dataset&&el.dataset.a; if (DE_CAMBIO.includes(a)){ acciones[a](el); render(); } });
document.addEventListener("input", e=>{ if (e.target.id==="resumen"){ S.resumenManual=e.target.value; guardar(); } });
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && S.modal){ S.modal=null; render(); } });

try{ const g=localStorage.getItem(CLAVE); if (g){ const x=JSON.parse(g); if (x && x.tomas){ S=x; S.modal=null; if (S.tomas.some(t=>t.estado==="generando")) setTimeout(terminar,900); } } }catch(e){}
render();
})();
</script>
