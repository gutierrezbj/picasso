# 18.16c · Realismo de móvil (preajuste de las pistas de realismo; HOT 02, regla 4, y REF 04, regla 12)
realismo_movil:
  en: "Raw phone photo look: deep depth of field with the whole frame sharp, no bokeh; muted desaturated grade, no HDR; directional window light with real shadow; unretouched skin with varied pores, a few moles and freckles, fine facial hair, slight redness around the nose, under-eye texture, flyaway hairs; real worn materials (micro-scratches, fabric pilling, fingerprints)."
