# Bloques de interpretación, voz y look. Propuestas 18.56, 18.57 y 18.58, SIN APROBAR.
# Redacción propia a partir de REF 04, sin nombres de directores, películas ni marcas.

# 18.56 · La emoción se escribe como una secuencia física, nunca con la palabra.
# El texto en inglés es una secuencia corta: inicio → gesto → cómo se mantiene o se resuelve.
emociones_video:
  - {id: sonrisa_falsa, nombre: "Sonrisa falsa", en: "mouth stretches into a smile while the eyes stay flat; blinking speeds up, a hard swallow, gaze drops before the smile returns"}
  - {id: orgullo, nombre: "Orgullo", en: "chin lifts, chest expands, a slow closed-lip smile, shoulders back, one satisfied slow blink, arms fold"}
  - {id: alivio, nombre: "Alivio", en: "a big visible exhale empties the chest, eyes close, raised brows settle, shoulders drop, hand to forehead, a small shaky smile only after the breath"}
  - {id: agotamiento, nombre: "Agotamiento", en: "eyelids drag down, a blink held too long, head drops and slowly lifts, slack jaw, long sigh, eyes reopen only halfway"}
  - {id: verguenza, nombre: "Vergüenza", en: "colour rises in the cheeks, eyes slide down and away, tight awkward half-smile, head tilts away, hand near the mouth"}
  - {id: culpa, nombre: "Culpa", en: "mouth opens but no words come, eyes slide down, hard swallow, hand to the back of the neck, gaze stays on the floor"}
  - {id: tristeza, nombre: "Tristeza contenida", en: "inner brow corners rise and pinch, mouth corners pull down, chin trembles once, gaze sinks with the head"}
  - {id: ansiedad, nombre: "Ansiedad", en: "brows stay knitted, eyes dart side to side, lower lip caught in the teeth, shallow fast breathing, hands clasped, weight shifting"}
  - {id: frustracion, nombre: "Frustración", en: "eyes squeeze shut, jaw shifts side to side, sharp exhale through the nose, one head shake, head tips back on a long defeated sigh"}
  - {id: determinacion, nombre: "Determinación", en: "eyes lift and lock forward, deep breath, jaw tightens at the hinge, eyes narrow, shoulders back, one short nod"}
  - {id: asombro, nombre: "Asombro", en: "eyes widen gradually without brow tension, mouth slowly opens, head tilts up, body leans in; the open look never fades"}
  - {id: comprension, nombre: "Se da cuenta", en: "blank thinking face breaks: eyes widen, brows rise, lips part on a silent breath, then a slow knowing nod"}
  - {id: confusion, nombre: "Confusión", en: "asymmetric brows, one up one down, eyes scanning, sharp head tilt, mouth slightly open; puzzlement grows rather than resolves"}
  - {id: aburrimiento, nombre: "Aburrimiento", en: "heavy lids, unfocused drifting gaze, a slow blink that lasts too long, relaxed jaw, long sigh, body settles still"}
  - {id: chuleria, nombre: "Chulería", en: "lids lower, one mouth corner twitches into a slow smirk, brows lift once, chin rises slightly, unbroken eye contact"}
  - {id: complicidad, nombre: "Complicidad", en: "chin lowers, gaze returns with a slow deliberate blink, a warm playful half-smile grows on one side, eye contact held"}
  - {id: sospecha, nombre: "Sospecha", en: "chin down while the eyes stay up, one brow higher, head turns slightly so the look lands sideways, mouth tightens at one corner, no blinking"}
  - {id: hartazgo, nombre: "Hartazgo", en: "eyes roll in a slow full arc with the head, air pushed out through the nose, eyes return half-lidded, flat stare, then look away"}
  - {id: dolor, nombre: "Dolor", en: "eyes clamp shut, teeth bared in a tense grimace, head jerks aside, one shoulder rises to the ear, face eases only slightly"}
  - {id: llanto, nombre: "Llanto", en: "eyes and nose redden, tears spill over the lower lid, breath catches in visible spasms, mouth squares, chin puckers and trembles, shoulders start to shake"}
  - {id: asco, nombre: "Asco", en: "nose wrinkles hard pulling the upper lip up, eyes narrow almost shut, chin retracts, head pulls back and away"}
  - {id: furia, nombre: "Furia", en: "brows drop and pull in, upper lip retracts over the teeth, nostrils flare, neck tendons tighten, head pushes forward, heavy breaths through the nose"}
  - {id: terror, nombre: "Terror", en: "brows rise and pinch, eyes wide and unblinking, mouth stretches, chin pulls back, chest rising and falling fast and shallow"}
  - {id: shock, nombre: "Shock", en: "eyes snap open showing white above the iris, brows shoot up, jaw drops, head jerks back, face freezes before a single blink"}
  - {id: risa, nombre: "Risa", en: "eyes crinkle into slits, mouth opens wide showing teeth, head drops forward then tips back, shoulders shake with each breath, settles into a lasting smile"}

# Emociones para imagen: misma idea. El set se fija para aislar la expresión.
# El set es una variable de la ficha. No va fijo en la plantilla, para no chocar con el realismo de móvil.
emociones_imagen:
  regla: "La emoción se describe con músculos y manos (por ejemplo, «solo sonríe la mitad inferior de la cara», «nudillos pálidos»), nunca con su nombre. Se fijan cámara, luz y fondo; la expresión es la única variable."
  clausula_hoja_en: "Image 1 defines {personaje}: face, hair, distinctive marks and wardrobe. If it is a character sheet with several angles or expressions, treat them all as one person. Do not use its background, layout or any expression shown in it. Only one person in the result."

